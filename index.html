  <script>
    (function () {
      try {
        var raw = localStorage.getItem("rss-feeds-settings-v1");
        var mode = raw ? (JSON.parse(raw).appearance || "lightsout") : "lightsout";
        if (mode === "auto") mode = matchMedia("(prefers-color-scheme: light)").matches ? "default" : "lightsout";
        if (mode !== "default" && mode !== "dim" && mode !== "lightsout") mode = "lightsout";
        document.documentElement.setAttribute("data-theme", mode);
        var colors = { default: "#ffffff", dim: "#15202b", lightsout: "#000000" };
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", colors[mode]);
        var scheme = document.querySelector('meta[name="color-scheme"]');
        if (scheme) scheme.setAttribute("content", mode === "default" ? "light" : "dark");
        var bar = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
        if (bar) bar.setAttribute("content", mode === "default" ? "default" : "black-translucent");
      } catch (err) {}
    })();
  </script>

<body>
  <div class="wco" aria-hidden="true"></div>
  <div id="app"></div>
  <div id="hover"></div>
  <div id="pull" aria-hidden="true"><span class="spin"></span></div>
  <button id="new-posts" type="button" hidden>New posts</button>
  <div id="offline" hidden>You're offline. Showing saved posts.</div>
  <div id="update" hidden>New version available. Refreshing when idle. <button type="button" id="update-go">Refresh</button></div>
  <div id="viewer" hidden></div>
  <div id="toast" hidden></div>
  <script src="app.js" defer></script>
</body>
