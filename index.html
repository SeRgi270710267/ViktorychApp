  <script>
    (function () {
      var path = location.pathname || "/";
      if (/\/index\.html$/i.test(path)) path = path.slice(0, -"index.html".length);
      path = path.replace(/\/(?:s|u)\/[^/]+$/, "/");
      if (path.slice(-1) !== "/") path += "/";
      var base = location.origin + path;
      var nodes = document.querySelectorAll("meta[content], link[href]");
      for (var i = 0; i < nodes.length; i++) {
        var el = nodes[i];
        ["content", "href"].forEach(function (attr) {
          var value = el.getAttribute(attr);
          if (!value || value.indexOf("__SITE_BASE__") < 0) return;
          el.setAttribute(attr, value.split("__SITE_BASE__").join(base));
        });
      }
    })();
  </script>

  <script>
    (function () {
      try {
        var narrow = window.matchMedia && window.matchMedia("(max-width: 1279px)").matches;
        var raw = localStorage.getItem("superintelapp-splits-v1");
        if (!raw) raw = localStorage.getItem("rss-" + "feeds-splits-v1");
        var n = 275;
        if (raw) {
          var map = JSON.parse(raw);
          var saved = Math.round(Number(map && map.sidebar));
          if (isFinite(saved) && saved > 0) n = saved;
        }
        if (narrow) {
          document.documentElement.setAttribute("data-nav", "icons");
          document.documentElement.style.setProperty("--nav-w", "88px");
          return;
        }
        if (n < 200) n = 88;
        else if (n < 248) n = 248;
        if (n > 275) n = 275;
        if (n < 88) n = 88;
        document.documentElement.style.setProperty("--nav-w", n + "px");
        if (n < 200) document.documentElement.setAttribute("data-nav", "icons");
      } catch (err) {}
    })();
  </script>

  <script>
    (function () {
      try {
        var key = "superintelapp-settings-v1";
        var raw = localStorage.getItem(key);
        if (!raw) {
          var previous = localStorage.getItem("rss-" + "feeds-settings-v1");
          if (previous) {
            raw = previous;
            try { localStorage.setItem(key, previous); } catch (err) {}
          }
        }
        var mode = raw ? (JSON.parse(raw).appearance || "lightsout") : "lightsout";
        if (mode === "auto") mode = matchMedia("(prefers-color-scheme: light)").matches ? "default" : "lightsout";
        if (mode !== "default" && mode !== "dim" && mode !== "lightsout") mode = "lightsout";
        document.documentElement.setAttribute("data-theme", mode);
        var colors = { default: "#FFFFFF", dim: "#15202B", lightsout: "#000000" };
        var metas = document.querySelectorAll('meta[name="theme-color"]');
        for (var i = 0; i < metas.length; i++) metas[i].setAttribute("content", colors[mode]);
        var scheme = document.querySelector('meta[name="color-scheme"]');
        if (scheme) scheme.setAttribute("content", mode === "default" ? "light" : "dark");
        var bar = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
        if (bar) bar.setAttribute("content", "black-translucent");
      } catch (err) {}
    })();
  </script>
