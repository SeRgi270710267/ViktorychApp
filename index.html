  <script>
    (function () {
      var key = "superintelapp-lang";
      var code = "en";
      try {
        var userPicked = localStorage.getItem("viktorychapp-lang-user-picked") === "1";
        var hasSession = !!localStorage.getItem("viktorychapp-accounts-session-v1");
        var isRu = false;
        try {
          var tz = (Intl && Intl.DateTimeFormat) ? Intl.DateTimeFormat().resolvedOptions().timeZone : "";
          if (/^(Europe\/(Moscow|Samara|Kaliningrad|Volgograd|Kirov|Astrakhan|Ulyanovsk|Saratov)|Asia\/(Yekaterinburg|Omsk|Novosibirsk|Barnaul|Tomsk|Novokuznetsk|Krasnoyarsk|Irkutsk|Chita|Yakutsk|Vladivostok|Magadan|Sakhalin|Srednekolymsk|Kamchatka|Anadyr))$/i.test(tz)) {
            isRu = true;
          }
          if (sessionStorage.getItem("viktorychapp-is-ru") === "1") isRu = true;
        } catch (e) {}

        var saved = localStorage.getItem(key);
        if ((userPicked || hasSession) && (saved === "ru" || saved === "es" || saved === "en")) {
          code = saved;
        } else if (isRu) {
          code = "ru";
          try { localStorage.setItem(key, "ru"); } catch (err) {}
        } else if (saved === "ru" || saved === "es" || saved === "en") {
          code = saved;
        } else if (saved == null) {
          var list = navigator.languages || [navigator.language || ""];
          var i;
          for (i = 0; i < list.length; i++) {
            var item = String(list[i] || "").toLowerCase().split("-")[0];
            if (item === "ru" || item === "es") { code = item; break; }
          }
          try { localStorage.setItem(key, code); } catch (err) {}
        }
      } catch (err) {}
      document.documentElement.lang = code;
    })();
  </script>
  <script>
    (function () {
      var path = location.pathname || "/";
      if (/\/index\.html$/i.test(path)) path = path.slice(0, -"index.html".length);
      path = path.replace(/\/(?:s|u)\/[^/]+$/, "/");
      if (path.slice(-1) !== "/") path += "/";
      var base = location.origin + path;
      var canon = document.querySelector('link[rel="canonical"]');
      if (canon && !canon.getAttribute("href")) canon.setAttribute("href", base);
      var ogUrl = document.querySelector('meta[property="og:url"]');
      if (ogUrl && !ogUrl.getAttribute("content")) ogUrl.setAttribute("content", base);
      var images = document.querySelectorAll('meta[property="og:image"], meta[name="twitter:image"]');
      for (var i = 0; i < images.length; i++) {
        var value = images[i].getAttribute("content") || "";
        if (!value || /^https?:/i.test(value)) continue;
        images[i].setAttribute("content", base + value.replace(/^\.\//, ""));
      }
    })();
  </script>

  <script>
    (function () {
      try {
        var narrow = window.matchMedia && window.matchMedia("(max-width: 1279px)").matches;
        var raw = localStorage.getItem("viktorychapp-splits-v1");
        if (!raw) raw = localStorage.getItem("superintelapp-splits-v1");
        if (!raw) raw = localStorage.getItem("rss-" + "feeds-splits-v1");
        if (raw) {
          try { localStorage.setItem("viktorychapp-splits-v1", raw); } catch (err) {}
        }
        var n = 275;
        if (raw) {
          var map = JSON.parse(raw);
          var saved = Math.round(Number(map && map.sidebar));
          if (isFinite(saved) && saved > 0) n = saved;
        }
        if (narrow) {
          document.documentElement.setAttribute("data-nav", "icons");
          document.documentElement.style.setProperty("--nav-w", "88px");
          return;
        }
        if (n < 200) n = 88;
        else if (n < 248) n = 248;
        if (n > 275) n = 275;
        if (n < 88) n = 88;
        document.documentElement.style.setProperty("--nav-w", n + "px");
        if (n < 200) document.documentElement.setAttribute("data-nav", "icons");
      } catch (err) {}
    })();
  </script>

  <script>
    (function () {
      try {
        var key = "viktorychapp-settings-v1";
        var raw = localStorage.getItem(key);
        if (!raw) raw = localStorage.getItem("superintelapp-settings-v1");
        if (!raw) raw = localStorage.getItem("rss-" + "feeds-settings-v1");
        if (raw) {
          try { localStorage.setItem(key, raw); } catch (err) {}
        }
        var mode = raw ? (JSON.parse(raw).appearance || "lightsout") : "lightsout";
        if (mode === "auto") mode = matchMedia("(prefers-color-scheme: light)").matches ? "default" : "lightsout";
        if (mode !== "default" && mode !== "dim" && mode !== "lightsout") mode = "lightsout";
        document.documentElement.setAttribute("data-theme", mode);
        var savedNav = raw ? JSON.parse(raw) : {};
        var navLayout = savedNav.navLayout === "bar" ? "bar" : "auto";
        document.documentElement.setAttribute("data-nav-layout", navLayout);
        if (navLayout === "bar" && savedNav.navLayoutLand === true) document.documentElement.setAttribute("data-nav-bar-land", "1");
        else document.documentElement.removeAttribute("data-nav-bar-land");
        var colors = { default: "#FFFFFF", dim: "#15202B", lightsout: "#000000" };
        var metas = document.querySelectorAll('meta[name="theme-color"]');
        for (var i = 0; i < metas.length; i++) metas[i].setAttribute("content", colors[mode]);
        var scheme = document.querySelector('meta[name="color-scheme"]');
        if (scheme) scheme.setAttribute("content", mode === "default" ? "light" : "dark");
        var bar = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
        if (bar) bar.setAttribute("content", "black-translucent");
      } catch (err) {}
    })();
  </script>

  <script>
    (function () {
      var RETRY = "viktorychapp-boot-retry";
      var shown = false;
      function tried() {
        try { return sessionStorage.getItem(RETRY) === "1"; } catch (err) { return false; }
      }
      function markTried() {
        try { sessionStorage.setItem(RETRY, "1"); } catch (err) { /* a private window still shows the screen */ }
      }
      function clearTried() {
        try { sessionStorage.removeItem(RETRY); } catch (err) { /* already clear */ }
      }
      function dropWorkers() {
        var jobs = [];
        if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
          jobs.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
            return Promise.all(regs.map(function (reg) { return reg.unregister(); }));
          }));
        }
        if (window.caches && caches.keys) {
          jobs.push(caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (key) { return caches.delete(key); }));
          }));
        }
        return Promise.all(jobs).catch(function () {});
      }
      function resetData() {
        try { localStorage.clear(); } catch (err) { /* private mode */ }
        try { sessionStorage.clear(); } catch (err) { /* private mode */ }
        var jobs = [dropWorkers()];
        if (window.indexedDB && indexedDB.databases) {
          jobs.push(indexedDB.databases().then(function (dbs) {
            return Promise.all((dbs || []).map(function (db) {
              return new Promise(function (resolve) {
                if (!db || !db.name) { resolve(); return; }
                var req = indexedDB.deleteDatabase(db.name);
                req.onsuccess = req.onerror = req.onblocked = function () { resolve(); };
              });
            }));
          }).catch(function () {}));
        }
        Promise.all(jobs).catch(function () {}).then(function () { location.reload(); });
      }
      function showScreen() {
        if (shown) return;
        shown = true;
        var root = document.getElementById("boot-guard");
        if (!root) {
          root = document.createElement("div");
          root.id = "boot-guard";
          root.setAttribute("role", "alert");
          document.documentElement.appendChild(root);
        }
        root.style.cssText = "position:fixed;inset:0;z-index:2147483647;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font:16px/1.45 -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif";
        root.textContent = "";
        var box = document.createElement("div");
        var title = document.createElement("p");
        title.textContent = "Something went wrong";
        var row = document.createElement("p");
        var reload = document.createElement("button");
        reload.type = "button";
        reload.id = "boot-reload";
        reload.textContent = "Reload";
        reload.style.cssText = "margin:0 8px;padding:10px 16px;border-radius:999px;border:0;background:#fff;color:#000;font:inherit";
        var reset = document.createElement("button");
        reset.type = "button";
        reset.id = "boot-reset";
        reset.textContent = "Reset app data";
        reset.style.cssText = reload.style.cssText;
        reload.addEventListener("click", function () { location.reload(); });
        reset.addEventListener("click", resetData);
        row.appendChild(reload);
        row.appendChild(reset);
        box.appendChild(title);
        box.appendChild(row);
        root.appendChild(box);
      }
      function recover() {
        if (shown) return;
        if (tried()) { showScreen(); return; }
        markTried();
        dropWorkers().then(function () { location.reload(); });
      }
      window.addEventListener("error", function (event) {
        var target = event && event.target;
        if (target && target !== window && target.nodeType === 1) return;
        recover();
      });
      window.addEventListener("unhandledrejection", function () { recover(); });
      window.addEventListener("load", function () {
        setTimeout(function () {
          if (shown) return;
          var text = (document.body && document.body.innerText || "").replace(/\s+/g, " ").trim();
          if (text.length > 8) clearTried();
          else recover();
        }, 12000);
      });
    })();
  </script>
