name: Retire named Internet Archive items

on:
  workflow_dispatch:
  # One push, limited to the marker file, so this run can start without a
  # dispatch token. The marker and this push trigger are removed after it.
  push:
    branches:
      - main
    paths:
      - .github/workflows/ia-retire.once

permissions:
  contents: write

concurrency:
  group: ia-retire
  cancel-in-progress: false

jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Copy named items onto anonymous items
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PYTHONUNBUFFERED: "1"
          IA_PACE_SECONDS: "2"
          IA_BACKOFF_SECONDS: "8"
        run: python3 scripts/ia_retire.py copy

      - name: Publish the manifest on the data branch
        run: |
          if [ ! -f archive/ia-manifest.json ]; then
            echo "[ia-retire] no manifest to publish"
            exit 1
          fi
          cp archive/ia-manifest.json /tmp/ia-manifest.json
          cp archive/ia-state.json /tmp/ia-state.json
          head=$(git rev-parse HEAD)
          restore() {
            git checkout -f "$head"
            mkdir -p archive
            cp /tmp/ia-manifest.json archive/ia-manifest.json
            cp /tmp/ia-state.json archive/ia-state.json
          }
          trap restore EXIT
          if ! git fetch -q --depth=1 origin data; then
            echo "[ia-retire] data branch is not available"
            exit 1
          fi
          git checkout -B ia-data-publish origin/data
          mkdir -p archive
          cp /tmp/ia-manifest.json archive/ia-manifest.json
          cp /tmp/ia-state.json archive/ia-state.json
          git add -f archive/ia-manifest.json archive/ia-state.json
          if git diff --cached --quiet; then
            echo "[ia-retire] manifest unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Archive media manifest"
          if ! git push origin HEAD:data; then
            git fetch -q --depth=1 origin data
            git checkout -B ia-data-publish origin/data
            mkdir -p archive
            cp /tmp/ia-manifest.json archive/ia-manifest.json
            cp /tmp/ia-state.json archive/ia-state.json
            git add -f archive/ia-manifest.json archive/ia-state.json
            if git diff --cached --quiet; then
              echo "[ia-retire] manifest unchanged"
              exit 0
            fi
            git commit -m "Archive media manifest"
            git push origin HEAD:data
          fi

      - name: Return to this commit
        if: always()
        run: git checkout --force "$GITHUB_SHA"

      - name: Delete named items after the copies check out
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PYTHONUNBUFFERED: "1"
          IA_PACE_SECONDS: "2"
          IA_BACKOFF_SECONDS: "8"
        run: python3 scripts/ia_retire.py delete
