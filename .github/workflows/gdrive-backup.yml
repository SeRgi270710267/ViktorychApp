# Private Google Drive backup. Scheduled and scripted. No assistant at runtime.
# GDRIVE_RCLONE_TOKEN is the owner's user OAuth token (scope drive.file).
# A missing secret skips the job. The token is never printed.
# Account data is not uploaded. See docs/gdrive-backup.md.

name: Google Drive backup

on:
  schedule:
    # 09:17 UTC, after the 07:47 UTC Internet Archive backup. GitHub may delay a slot.
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gdrive-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Skip when the Drive token is not set
        id: token
        env:
          GDRIVE_RCLONE_TOKEN: ${{ secrets.GDRIVE_RCLONE_TOKEN }}
        run: |
          if [ -z "${GDRIVE_RCLONE_TOKEN}" ]; then
            echo "[gdrive] GDRIVE_RCLONE_TOKEN is not set; skipping the upload"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'

      - uses: actions/setup-python@v5
        if: steps.token.outputs.present == 'true'
        with:
          python-version: "3.12"

      - name: Install rclone
        if: steps.token.outputs.present == 'true'
        run: |
          set -euo pipefail
          version="v1.75.2"
          curl -fsSL -o /tmp/rclone.zip "https://downloads.rclone.org/${version}/rclone-${version}-linux-amd64.zip"
          unzip -q /tmp/rclone.zip -d /tmp
          sudo install -m 0755 "/tmp/rclone-${version}-linux-amd64/rclone" /usr/local/bin/rclone
          rclone version

      - name: Fetch stored feeds and the media manifest
        if: steps.token.outputs.present == 'true'
        run: git fetch --depth=1 origin data || echo "[gdrive] data branch is not available"

      - name: Install yt-dlp
        if: steps.token.outputs.present == 'true'
        run: python3 -m pip install --disable-pip-version-check -q yt-dlp

      - name: Back up private files
        if: steps.token.outputs.present == 'true'
        env:
          GDRIVE_RCLONE_TOKEN: ${{ secrets.GDRIVE_RCLONE_TOKEN }}
          GDRIVE_FETCH_TIKTOK: "1"
          PYTHONUNBUFFERED: "1"
        run: python3 scripts/gdrive_backup.py
