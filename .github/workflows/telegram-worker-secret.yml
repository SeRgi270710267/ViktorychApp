# One-off. Pushing .github/telegram-worker-secret to main copies the Actions
# secret TELEGRAM_BOT_TOKEN into the viktorych-accounts Worker. Wrangler reads
# the value from stdin. Nothing in the log is the secret.

name: Telegram worker secret

on:
  push:
    branches:
      - main
    paths:
      - ".github/telegram-worker-secret"

permissions:
  contents: read

jobs:
  put:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Copy TELEGRAM_BOT_TOKEN into the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set"
            exit 1
          fi
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ]; then
            echo "TELEGRAM_BOT_TOKEN is not set"
            exit 1
          fi
          cd worker
          npm ci
          set +e
          printf '%s' "$TELEGRAM_BOT_TOKEN" | npx wrangler secret put TELEGRAM_BOT_TOKEN --name viktorych-accounts > /tmp/wrangler-secret.txt 2>&1
          code=$?
          set -e
          SECRET_PUT_CODE="$code" python3 - <<'PY'
          import os, re, pathlib, sys
          text = pathlib.Path("/tmp/wrangler-secret.txt").read_text(encoding="utf-8", errors="replace")
          for name in ("TELEGRAM_BOT_TOKEN", "CLOUDFLARE_API_TOKEN", "CLOUDFLARE_ACCOUNT_ID"):
              value = os.environ.get(name) or ""
              if len(value) >= 4:
                  text = text.replace(value, "[redacted]")
          text = re.sub(r"\b\d{6,}:[A-Za-z0-9_-]{20,}\b", "[redacted]", text)
          sys.stdout.write(text)
          if not text.endswith("\n"):
              sys.stdout.write("\n")
          sys.exit(int(os.environ.get("SECRET_PUT_CODE") or "1"))
          PY

      - name: Check a signed-in /tg request
        if: success()
        env:
          PYTHONUNBUFFERED: "1"
        run: python3 scripts/telegram_worker_secret_check.py
