# Copies the Actions secret WORKER_DISPATCH_TOKEN into the viktorych-accounts
# Worker as GITHUB_DISPATCH_TOKEN. GitHub rejects secret names that start
# with GITHUB_. Wrangler reads the value from stdin. Nothing in the log is
# the secret. The Actions cache key is a sha256 of the value, so a later run
# does not call wrangler again for the same secret.

name: Worker dispatch secret

on:
  workflow_dispatch:
  schedule:
    # Every 30 minutes, so a secret added in the repo settings is copied
    # without another push. GitHub may delay a slot.
    - cron: "*/30 * * * *"
  push:
    branches:
      - main
    paths:
      - ".github/worker-dispatch-secret"

permissions:
  contents: read
  actions: write

concurrency:
  group: worker-dispatch-secret
  cancel-in-progress: false

jobs:
  put:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check WORKER_DISPATCH_TOKEN
        id: token
        env:
          WORKER_DISPATCH_TOKEN: ${{ secrets.WORKER_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${WORKER_DISPATCH_TOKEN:-}" ]; then
            echo "WORKER_DISPATCH_TOKEN is not set yet"
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hash=$(printf '%s' "$WORKER_DISPATCH_TOKEN" | sha256sum | awk '{print $1}')
          if ! printf '%s' "$hash" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "sha256 of the dispatch token failed"
            exit 1
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

      - name: Restore the applied sha256
        id: applied
        if: steps.token.outputs.present == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .cache/worker-dispatch-applied
          key: worker-dispatch-${{ steps.token.outputs.hash }}

      - name: Already copied
        if: steps.token.outputs.present == 'true' && steps.applied.outputs.cache-hit == 'true'
        run: echo "GITHUB_DISPATCH_TOKEN already matches this value"

      - uses: actions/setup-node@v4
        if: steps.token.outputs.present == 'true' && steps.applied.outputs.cache-hit != 'true'
        with:
          node-version: "22"

      - name: Copy WORKER_DISPATCH_TOKEN into the Worker
        if: steps.token.outputs.present == 'true' && steps.applied.outputs.cache-hit != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_DISPATCH_TOKEN: ${{ secrets.WORKER_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set"
            exit 1
          fi
          cd worker
          npm ci
          set +e
          printf '%s' "$WORKER_DISPATCH_TOKEN" | npx wrangler secret put GITHUB_DISPATCH_TOKEN --name viktorych-accounts > /tmp/wrangler-secret.txt 2>&1
          code=$?
          set -e
          SECRET_PUT_CODE="$code" python3 - <<'PY'
          import os, re, pathlib, sys
          text = pathlib.Path("/tmp/wrangler-secret.txt").read_text(encoding="utf-8", errors="replace")
          for name in ("WORKER_DISPATCH_TOKEN", "CLOUDFLARE_API_TOKEN", "CLOUDFLARE_ACCOUNT_ID"):
              value = os.environ.get(name) or ""
              if len(value) >= 4:
                  text = text.replace(value, "[redacted]")
          text = re.sub(r"\bgithub_pat_[A-Za-z0-9_]{20,}\b", "[redacted]", text)
          text = re.sub(r"\bgh[pousr]_[A-Za-z0-9_]{20,}\b", "[redacted]", text)
          text = re.sub(r"\b\d{6,}:[A-Za-z0-9_-]{20,}\b", "[redacted]", text)
          sys.stdout.write(text)
          if not text.endswith("\n"):
              sys.stdout.write("\n")
          sys.exit(int(os.environ.get("SECRET_PUT_CODE") or "1"))
          PY

      - name: Dispatch tiktok-live.yml through the Worker
        if: steps.token.outputs.present == 'true' && steps.applied.outputs.cache-hit != 'true'
        working-directory: worker
        env:
          WORKER_DISPATCH_TOKEN: ${{ secrets.WORKER_DISPATCH_TOKEN }}
        run: node dispatch-live-check.mjs

      - name: Record the applied sha256
        if: steps.token.outputs.present == 'true' && steps.applied.outputs.cache-hit != 'true'
        env:
          DISPATCH_TOKEN_SHA256: ${{ steps.token.outputs.hash }}
        run: |
          set -euo pipefail
          mkdir -p .cache
          printf '%s\n' "$DISPATCH_TOKEN_SHA256" > .cache/worker-dispatch-applied

      - name: Save the applied sha256
        if: steps.token.outputs.present == 'true' && steps.applied.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/worker-dispatch-applied
          key: worker-dispatch-${{ steps.token.outputs.hash }}
