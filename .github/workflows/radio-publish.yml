# Encode the ViktorychMusic loop from the WAV masters and publish it to R2.
# Push to main starts it. It does not take the Pages concurrency lock.

name: Publish radio loop

on:
  push:
    branches:
      - main
    paths:
      - scripts/radio_loop.py
      - .github/workflows/radio-publish.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: radio-publish
  cancel-in-progress: true

jobs:
  publish:
    name: Encode and publish
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        timeout-minutes: 8
        run: |
          set -euo pipefail
          mkdir -p /tmp/ffmpeg-dist
          curl -fsSL --retry 5 --retry-all-errors -o /tmp/ffmpeg.tar.xz \
            https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          tar -xJf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg-dist
          bin=$(find /tmp/ffmpeg-dist -type f -path '*/bin/ffmpeg' | head -n 1)
          test -n "$bin"
          sudo install -m 755 "$bin" /usr/local/bin/ffmpeg
          ffmpeg -version | head -n 2

      - name: Publish the FLAC loop
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/radio_loop.py --fetch --publish
