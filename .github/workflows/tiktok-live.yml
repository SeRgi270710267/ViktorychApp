name: TikTok live

on:
  schedule:
    # The Worker cron checks lives every minute and starts a recorder or an
    # uploader only when there is something to save. This hourly run is the
    # backstop when that dispatch is missed.
    - cron: "41 * * * *"
  workflow_dispatch:
    inputs:
      status:
        description: "Print recording counts and skip the poll"
        required: false
        default: "0"
  pull_request:
    paths:
      - "scripts/tiktok_record.py"
      - "scripts/tiktok_sync.py"
      - "scripts/owner_keys.py"
      - "scripts/past_live_chrome_test.mjs"
      - "shared/tiktok-live.js"
      - ".github/workflows/tiktok-live.yml"
      - ".github/workflows/tiktok-record.yml"
      - ".github/workflows/tiktok-live-upload.yml"

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('tiktok-live-pr-{0}', github.event.pull_request.number) || 'tiktok-live-poll' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  selftest:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Cache ffmpeg
        id: ffmpeg-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ffmpeg-static
          key: ffmpeg-static-linux64-v1

      - name: Install ffmpeg
        run: |
          set -euo pipefail
          dir="$HOME/.cache/ffmpeg-static"
          if [ ! -x "$dir/ffmpeg" ]; then
            mkdir -p "$dir"
            curl -fsSL --retry 5 --retry-all-errors --connect-timeout 20 --max-time 180 -o /tmp/ffmpeg.tar.xz \
              https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
            tar -xJf /tmp/ffmpeg.tar.xz -C /tmp
            bin=$(find /tmp/ffmpeg-master-latest-linux64-gpl -type f -path '*/bin/ffmpeg' | head -n 1)
            probe=$(find /tmp/ffmpeg-master-latest-linux64-gpl -type f -path '*/bin/ffprobe' | head -n 1)
            test -n "$bin"
            test -n "$probe"
            install -m 755 "$bin" "$dir/ffmpeg"
            install -m 755 "$probe" "$dir/ffprobe"
          fi
          sudo install -m 755 "$dir/ffmpeg" /usr/local/bin/ffmpeg
          sudo install -m 755 "$dir/ffprobe" /usr/local/bin/ffprobe
          ffmpeg -version | head -n 1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Cache Chrome
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/chrome-for-testing
          key: chrome-for-testing-linux64-v1

      - name: Self-test
        run: |
          python3 scripts/owner_keys.py --selftest
          python3 scripts/tiktok_record.py --selftest
          node scripts/past_live_chrome_test.mjs

  status:
    if: github.event_name == 'workflow_dispatch' && inputs.status == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Recording counts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/tiktok_record.py --status

  live:
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.status != '1')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Refresh live status
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_DISPATCH_TOKEN: ${{ secrets.WORKER_DISPATCH_TOKEN }}
          ACCOUNTS_API: ${{ vars.ACCOUNTS_API }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "Cloudflare credentials are not set; skipping the live poll."
            exit 0
          fi
          mkdir -p owner
          code=$(curl -sS -o owner/tiktok.json -w "%{http_code}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/viktorych-data/objects/owner/tiktok.json" || echo 000)
          if [ "$code" != "200" ]; then
            echo "owner TikTok data is not uploaded yet; skipping."
            rm -f owner/tiktok.json
            exit 0
          fi
          python3 scripts/tiktok_sync.py --live-only

      - name: Plan recordings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TIKTOK_RECORD_CAP: "16"
        run: python3 scripts/tiktok_record.py --plan --dispatch
