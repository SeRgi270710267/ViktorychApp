name: Handle guard

on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - ".github/workflows/actions-cleanup.once"
      - ".github/workflows/actions-cleanup.yml"
      - "scripts/actions_cleanup.py"

# A new push to a pull request cancels that pull request's older run, so
# superseded commits stop holding runners. Pushes to main never cancel each
# other (one group per run).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Structural self-test
        run: python3 scripts/handle_guard.py --selftest

      - name: Compare the tree with the private catalog
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HANDLE_DENYLIST: ${{ secrets.HANDLE_DENYLIST }}
          OWNER_IDS: ${{ secrets.OWNER_IDS }}
          HANDLE_ALLOWLIST: ${{ secrets.HANDLE_ALLOWLIST }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          HANDLE_GUARD_REQUIRE_CATALOG: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: python3 scripts/handle_guard.py
