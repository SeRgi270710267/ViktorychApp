name: Navigation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app.js"
      - "styles.css"
      - "accounts.js"
      - "i18n/**"
      - "scripts/bottom_nav_test.mjs"
      - "scripts/home_reach_test.mjs"
      - "scripts/profile_tabs_order_test.js"
      - "scripts/profile_tabs_test.mjs"
      - "scripts/nav_custom_test.js"
      - "scripts/dock_test.js"
      - "scripts/landscape_layout_test.mjs"
      - "scripts/phone_resize_test.mjs"
      - "scripts/profile_layout_test.mjs"
      - "scripts/menu_pages_test.mjs"
      - "scripts/ios_webkit_test.mjs"
      - "shared/ios.js"
      - "index.html"
      - "dock.js"
      - "dock.css"
      - "worker/**"
      - ".github/workflows/nav-custom.yml"
  push:
    branches:
      - main
    paths:
      - "app.js"
      - "styles.css"
      - "accounts.js"
      - "i18n/**"
      - "scripts/bottom_nav_test.mjs"
      - "scripts/home_reach_test.mjs"
      - "scripts/profile_tabs_order_test.js"
      - "scripts/profile_tabs_test.mjs"
      - "scripts/nav_custom_test.js"
      - "scripts/dock_test.js"
      - "scripts/landscape_layout_test.mjs"
      - "scripts/phone_resize_test.mjs"
      - "scripts/profile_layout_test.mjs"
      - "scripts/menu_pages_test.mjs"
      - "scripts/ios_webkit_test.mjs"
      - "shared/ios.js"
      - "index.html"
      - "dock.js"
      - "dock.css"
      - "worker/**"
      - ".github/workflows/nav-custom.yml"

# A new push to a pull request cancels that pull request's older run, so
# superseded commits stop holding runners. Pushes to main never cancel each
# other (one group per run).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  nav:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce # v1
        with:
          chrome-version: stable
      - name: Sidebar customization
        run: node scripts/nav_custom_test.js
      - name: Bottom navigation and phone landscape
        run: node scripts/bottom_nav_test.mjs

      - name: Home stays reachable on a phone
        run: |
          npm install --prefix /tmp/pw --no-fund --no-audit playwright-core
          PLAYWRIGHT_CORE=/tmp/pw/node_modules/playwright-core/index.js node scripts/home_reach_test.mjs

      - name: Profile tabs can be reordered
        run: |
          node scripts/profile_tabs_order_test.js
          PLAYWRIGHT_CORE=/tmp/pw/node_modules/playwright-core/index.js node scripts/profile_tabs_test.mjs
      - name: Corner drawers
        run: node scripts/dock_test.js
      - name: Landscape layout
        run: |
          npm install --prefix /tmp/landscape-pw playwright-core
          PLAYWRIGHT_CORE=/tmp/landscape-pw/node_modules/playwright-core/index.js node scripts/landscape_layout_test.mjs
          PLAYWRIGHT_CORE=/tmp/landscape-pw/node_modules/playwright-core/index.js node scripts/phone_resize_test.mjs
          PLAYWRIGHT_CORE=/tmp/landscape-pw/node_modules/playwright-core/index.js node scripts/profile_layout_test.mjs
          PLAYWRIGHT_CORE=/tmp/landscape-pw/node_modules/playwright-core/index.js node scripts/menu_pages_test.mjs
          PLAYWRIGHT_CORE=/tmp/landscape-pw/node_modules/playwright-core/index.js node scripts/about_layout_test.mjs
          PLAYWRIGHT_CORE=/tmp/landscape-pw/node_modules/playwright-core/index.js node scripts/points_layout_test.mjs
          PLAYWRIGHT_CORE=/tmp/landscape-pw/node_modules/playwright-core/index.js node scripts/stories_layout_test.mjs
      - name: iOS WebKit layout
        run: |
          npm install --prefix /tmp/pw-ios-nav --no-fund --no-audit playwright
          cd /tmp/pw-ios-nav && npx playwright install --with-deps webkit
          cd "${GITHUB_WORKSPACE}"
          PLAYWRIGHT_CORE=/tmp/pw-ios-nav/node_modules/playwright-core/index.js node scripts/ios_webkit_test.mjs
