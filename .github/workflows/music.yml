name: Music catalog

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  apply:
    # The repository owner is the org. The script compares the actor to OWNER_ACTOR_SHA256.
    if: (github.event.issue.author_association == 'OWNER' || github.event.issue.author_association == 'MEMBER') && (startsWith(github.event.issue.title, 'Music catalog'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Update data/music.json
        env:
          ACTOR: ${{ github.actor }}
          OWNER_ACTOR_SHA256: ${{ secrets.OWNER_ACTOR_SHA256 }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/music_catalog.py
