name: Discord live

on:
  workflow_dispatch:
  schedule:
    # Backup only. The Worker cron dispatches this workflow every 15 minutes
    # when nothing is queued or running. A five-minute cron stacked a new
    # run behind the long job all day. This slot is the backstop.
    - cron: "23 */6 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/discord-live.yml"
      - "scripts/discord_live.py"
      - "scripts/discord_publish.py"
      - "scripts/pages_deploy.js"
      - "feeds.config.json"

# One long job. cancel-in-progress is false, so a cron tick does not kill it.
concurrency:
  group: discord-live
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read
  issues: write

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    environment:
      name: github-pages
      url: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Install the Pages deploy helper
        run: npm install --no-save --prefix "$RUNNER_TEMP/discord-live" @actions/artifact@2.3.2 @actions/core@1.11.1

      - name: Poll Discord read-only and publish
        timeout-minutes: 348
        env:
          DISCORD_USER_TOKEN: ${{ secrets.DISCORD_USER_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NODE_PATH: ${{ runner.temp }}/discord-live/node_modules
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_DISPATCH_TOKEN: ${{ secrets.WORKER_DISPATCH_TOKEN }}
          ACCOUNTS_API: ${{ vars.ACCOUNTS_API }}
        run: |
          if [ -n "${DISCORD_USER_TOKEN:-}" ]; then
            echo "::add-mask::${DISCORD_USER_TOKEN}"
          fi
          python3 scripts/discord_live.py
