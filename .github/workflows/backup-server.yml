name: Backup Server

on:
  pull_request:
    paths:
      - "backup-server/**"
      - "worker/src/**"
      - "render.yaml"
      - ".github/workflows/backup-server.yml"
  push:
    branches:
      - main
    paths:
      - "backup-server/**"
      - "worker/src/**"
      - "render.yaml"
      - ".github/workflows/backup-server.yml"
  workflow_dispatch:

# A new push to a pull request cancels that pull request's older run, so
# superseded commits stop holding runners. Pushes to main never cancel each
# other (one group per run).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install backup server dependencies
        run: npm install --prefix backup-server

      - name: Test the shared Cloudflare D1/R2 bindings
        run: node backup-server/remote.test.mjs

      - name: Test login against a shared database
        run: node backup-server/remote-integration.test.mjs
