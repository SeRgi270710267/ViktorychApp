name: Accounts

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - cursor/accounts-deploy-7706
    paths:
      - "worker/**"
      - "shared/**"
      - ".github/workflows/accounts.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Deploy the account worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OWNER_CLAIM_CODE: ${{ secrets.OWNER_CLAIM_CODE }}
          ACCOUNT_PEPPER: ${{ secrets.ACCOUNT_PEPPER }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "Cloudflare credentials are not set; skipping the account worker."
            exit 0
          fi
          cd worker
          npm ci
          # The committed database_id is a placeholder. Wrangler treats any
          # value as the real id, so clear it and look the database up by name.
          python3 - <<'PY'
          import pathlib, re
          path = pathlib.Path("wrangler.toml")
          text = path.read_text(encoding="utf-8")
          text = re.sub(
              r'database_id = "00000000-0000-0000-0000-000000000001"',
              'database_id = ""',
              text,
          )
          path.write_text(text, encoding="utf-8")
          PY
          set +e
          npx wrangler d1 info viktorych-accounts > /tmp/d1.txt 2>&1
          info_code=$?
          set -e
          if [ "$info_code" -ne 0 ]; then
            cp /tmp/d1.txt /tmp/d1-info.txt
            set +e
            npx wrangler d1 create viktorych-accounts > /tmp/d1.txt 2>&1
            create_code=$?
            set -e
            if [ "$create_code" -ne 0 ]; then
              echo "d1 info failed and d1 create failed"
              cat /tmp/d1-info.txt
              echo "----"
              cat /tmp/d1.txt
              exit "$create_code"
            fi
          fi
          python3 - <<'PY'
          import pathlib, re, sys
          text = pathlib.Path("/tmp/d1.txt").read_text(encoding="utf-8", errors="replace")
          found = re.search(r"([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})", text)
          if not found:
              print("database id was not found", file=sys.stderr)
              sys.exit(1)
          path = pathlib.Path("wrangler.toml")
          path.write_text(re.sub(r'database_id = "[^"]+"', 'database_id = "%s"' % found.group(1), path.read_text(encoding="utf-8")), encoding="utf-8")
          print("database id updated on the runner")
          PY
          npx wrangler d1 migrations apply viktorych-accounts --remote
          npx wrangler r2 bucket create viktorych-data || true
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request
          account = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          token = os.environ["CLOUDFLARE_API_TOKEN"]
          url = f"https://api.cloudflare.com/client/v4/accounts/{account}/workers/subdomain"
          headers = {"Authorization": "Bearer " + token, "Content-Type": "application/json"}

          def fail(step, code, message):
              print(f"{step} failed: {code} {message}")
              raise SystemExit(1)

          def read_error(exc):
              raw = exc.read().decode("utf-8", "replace")
              try:
                  body = json.loads(raw)
              except json.JSONDecodeError:
                  return exc.code, raw[:180]
              errors = body.get("errors") or [{}]
              return errors[0].get("code"), errors[0].get("message")

          req = urllib.request.Request(url, headers=headers)
          try:
              with urllib.request.urlopen(req, timeout=30) as res:
                  body = json.loads(res.read().decode("utf-8"))
          except urllib.error.HTTPError as exc:
              code, message = read_error(exc)
              if code != 10007:
                  fail("workers.dev subdomain lookup", code, message)
              body = {}
          sub = str(((body.get("result") or {}) if isinstance(body, dict) else {}).get("subdomain") or "").strip()
          if sub:
              print("workers.dev subdomain already registered:", sub)
          else:
              name = "viktorych-accounts"
              put = urllib.request.Request(
                  url,
                  data=json.dumps({"subdomain": name}).encode("utf-8"),
                  method="PUT",
                  headers=headers,
              )
              try:
                  with urllib.request.urlopen(put, timeout=30) as res:
                      created = json.loads(res.read().decode("utf-8"))
              except urllib.error.HTTPError as exc:
                  code, message = read_error(exc)
                  fail("workers.dev subdomain registration", code, message)
              if not created.get("success"):
                  errors = created.get("errors") or [{}]
                  fail("workers.dev subdomain registration", errors[0].get("code"), errors[0].get("message"))
              print("workers.dev subdomain registered:", (created.get("result") or {}).get("subdomain") or name)
          PY
          npx wrangler deploy
          if [ -n "${OWNER_CLAIM_CODE:-}" ]; then printf '%s' "$OWNER_CLAIM_CODE" | npx wrangler secret put OWNER_CLAIM_CODE; fi
          if [ -n "${ACCOUNT_PEPPER:-}" ]; then printf '%s' "$ACCOUNT_PEPPER" | npx wrangler secret put ACCOUNT_PEPPER; fi
          if [ -n "${TURNSTILE_SECRET:-}" ]; then printf '%s' "$TURNSTILE_SECRET" | npx wrangler secret put TURNSTILE_SECRET; fi
          echo "account worker deployed"
