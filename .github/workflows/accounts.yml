name: Accounts

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "worker/**"
      - "shared/**"
      - "presence.js"
      - "presence.css"
      - "passkeys.js"
      - "app-lock.js"
      - "privacy-screen.js"
      - "scripts/presence_chrome_test.mjs"
      - "scripts/webauthn_lock_test.mjs"
      - "scripts/app_lock_crypto_test.mjs"
      - "scripts/social_ui_test.js"
      - "accounts.js"
      - "app.js"
      - ".github/workflows/accounts.yml"
  push:
    branches:
      - main
    paths:
      - "worker/**"
      - "shared/**"
      - "presence.js"
      - "presence.css"
      - "passkeys.js"
      - "app-lock.js"
      - "privacy-screen.js"
      - "scripts/presence_chrome_test.mjs"
      - "scripts/webauthn_lock_test.mjs"
      - "scripts/app_lock_crypto_test.mjs"
      - "scripts/social_ui_test.js"
      - "accounts.js"
      - "app.js"
      - ".github/workflows/accounts.yml"

# A new push to a pull request cancels that pull request's older run, so
# superseded commits stop holding runners. Pushes to main never cancel each
# other (one group per run).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Test the account worker
        working-directory: worker
        run: npm ci && npm test

      - name: Privacy cover rules
        run: node scripts/app_lock_crypto_test.mjs

      - uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce # v1
        id: setup-chrome
        with:
          chrome-version: stable

      - name: Social graph page check
        run: node scripts/social_ui_test.js

      - name: Presence page check
        env:
          CHROME: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: node scripts/presence_chrome_test.mjs

      - name: WebAuthn virtual authenticator, app lock, and privacy screen
        env:
          CHROME: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          npm install --prefix /tmp/pw --no-fund --no-audit playwright-core
          PLAYWRIGHT_MJS=/tmp/pw/node_modules/playwright-core/index.js node scripts/webauthn_lock_test.mjs

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Deploy the account worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OWNER_CLAIM_CODE: ${{ secrets.OWNER_CLAIM_CODE }}
          ACCOUNT_PEPPER: ${{ secrets.ACCOUNT_PEPPER }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "Cloudflare credentials are not set; skipping the account worker."
            exit 0
          fi
          cd worker
          npm ci
          # The committed database_id is a placeholder. Wrangler treats any
          # value as the real id, so clear it and look the database up by name.
          python3 - <<'PY'
          import pathlib, re
          path = pathlib.Path("wrangler.toml")
          text = path.read_text(encoding="utf-8")
          text = re.sub(
              r'database_id = "00000000-0000-0000-0000-000000000001"',
              'database_id = ""',
              text,
          )
          path.write_text(text, encoding="utf-8")
          PY
          set +e
          npx wrangler d1 info viktorych-accounts > /tmp/d1.txt 2>&1
          info_code=$?
          set -e
          if [ "$info_code" -ne 0 ]; then
            cp /tmp/d1.txt /tmp/d1-info.txt
            set +e
            npx wrangler d1 create viktorych-accounts > /tmp/d1.txt 2>&1
            create_code=$?
            set -e
            if [ "$create_code" -ne 0 ]; then
              echo "d1 info failed and d1 create failed"
              cat /tmp/d1-info.txt
              echo "----"
              cat /tmp/d1.txt
              exit "$create_code"
            fi
          fi
          python3 - <<'PY'
          import pathlib, re, sys
          text = pathlib.Path("/tmp/d1.txt").read_text(encoding="utf-8", errors="replace")
          found = re.search(r"([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})", text)
          if not found:
              print("database id was not found", file=sys.stderr)
              sys.exit(1)
          path = pathlib.Path("wrangler.toml")
          path.write_text(re.sub(r'database_id = "[^"]+"', 'database_id = "%s"' % found.group(1), path.read_text(encoding="utf-8")), encoding="utf-8")
          print("database id updated on the runner")
          PY
          npx wrangler d1 migrations apply viktorych-accounts --remote || true
          npx wrangler r2 bucket create viktorych-data || true
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request
          account = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          token = os.environ["CLOUDFLARE_API_TOKEN"]
          url = f"https://api.cloudflare.com/client/v4/accounts/{account}/workers/subdomain"
          headers = {"Authorization": "Bearer " + token, "Content-Type": "application/json"}

          def fail(step, code, message):
              print(f"{step} failed: {code} {message}")
              raise SystemExit(1)

          def read_error(exc):
              raw = exc.read().decode("utf-8", "replace")
              try:
                  body = json.loads(raw)
              except json.JSONDecodeError:
                  return exc.code, raw[:180]
              errors = body.get("errors") or [{}]
              return errors[0].get("code"), errors[0].get("message")

          req = urllib.request.Request(url, headers=headers)
          try:
              with urllib.request.urlopen(req, timeout=30) as res:
                  body = json.loads(res.read().decode("utf-8"))
          except urllib.error.HTTPError as exc:
              code, message = read_error(exc)
              if code != 10007:
                  fail("workers.dev subdomain lookup", code, message)
              body = {}
          sub = str(((body.get("result") or {}) if isinstance(body, dict) else {}).get("subdomain") or "").strip()
          if sub:
              print("workers.dev subdomain already registered:", sub)
          else:
              name = "viktorych-accounts"
              put = urllib.request.Request(
                  url,
                  data=json.dumps({"subdomain": name}).encode("utf-8"),
                  method="PUT",
                  headers=headers,
              )
              try:
                  with urllib.request.urlopen(put, timeout=30) as res:
                      created = json.loads(res.read().decode("utf-8"))
              except urllib.error.HTTPError as exc:
                  code, message = read_error(exc)
                  fail("workers.dev subdomain registration", code, message)
              if not created.get("success"):
                  errors = created.get("errors") or [{}]
                  fail("workers.dev subdomain registration", errors[0].get("code"), errors[0].get("message"))
              print("workers.dev subdomain registered:", (created.get("result") or {}).get("subdomain") or name)
          PY
          python3 ../scripts/cf_kv_bind.py --toml wrangler.toml
          npx wrangler deploy
          if [ -n "${OWNER_CLAIM_CODE:-}" ]; then printf '%s' "$OWNER_CLAIM_CODE" | npx wrangler secret put OWNER_CLAIM_CODE; fi
          if [ -n "${ACCOUNT_PEPPER:-}" ]; then printf '%s' "$ACCOUNT_PEPPER" | npx wrangler secret put ACCOUNT_PEPPER; fi
          if [ -n "${TURNSTILE_SECRET:-}" ]; then printf '%s' "$TURNSTILE_SECRET" | npx wrangler secret put TURNSTILE_SECRET; fi
          if [ -n "${TELEGRAM_CHANNEL_ID:-}" ]; then printf '%s' "$TELEGRAM_CHANNEL_ID" | npx wrangler secret put TELEGRAM_CHANNEL_ID; fi
          echo "account worker deployed"

      # The new Worker must answer /v1/health. If it does not within about two
      # minutes, roll back to the previous version and fail the run.
      - name: Health check, roll back on failure
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCOUNTS_API: ${{ vars.ACCOUNTS_API }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then echo "no Cloudflare token; skipping"; exit 0; fi
          api="${ACCOUNTS_API:-$(python3 -c 'import sys; sys.path.insert(0, "scripts"); import accounts_publish as a; print(a.workers_api())' 2>/dev/null)}"
          if [ -z "$api" ]; then echo "no Worker URL; skipping"; exit 0; fi
          for i in $(seq 1 12); do
            if curl -fsS --max-time 10 "${api%/}/v1/health" | grep -q '"ok":true'; then echo "worker healthy"; exit 0; fi
            sleep 10
          done
          echo "::error::Worker health check failed; rolling back"
          cd worker && npx wrangler rollback --message "health check failed for ${GITHUB_SHA}" || true
          exit 1

      - name: Check owner TikTok playback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/tiktok_play_check.py
