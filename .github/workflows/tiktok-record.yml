name: TikTok record

on:
  workflow_dispatch:
    inputs:
      handle:
        description: Public handle
        required: true
        type: string
      part:
        description: Part number
        required: false
        default: "1"
        type: string
      room:
        description: Room id
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: write

# One live, one job. The next part is dispatched when this job exits, so
# the same group chains the handoff instead of overlapping it. A second
# dispatch for this handle waits and is not cancelled. Other handles run
# at the same time.
concurrency:
  group: tiktok-record-${{ inputs.handle }}
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Free disk for the capture
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /
          python3 - <<'PY'
          import shutil, sys
          free = shutil.disk_usage("/").free
          print("disk free bytes", free)
          if free < 4 * 1024 * 1024 * 1024:
              sys.exit("runner disk is below 4 GiB after cleanup")
          PY

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Cache ffmpeg
        id: ffmpeg-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ffmpeg-static
          key: ffmpeg-static-linux64-v1

      - name: Install ffmpeg
        run: |
          set -euo pipefail
          dir="$HOME/.cache/ffmpeg-static"
          if [ ! -x "$dir/ffmpeg" ]; then
            mkdir -p "$dir"
            curl -fsSL --retry 5 --retry-all-errors -o /tmp/ffmpeg.tar.xz \
              https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
            tar -xJf /tmp/ffmpeg.tar.xz -C /tmp
            bin=$(find /tmp/ffmpeg-master-latest-linux64-gpl -type f -path '*/bin/ffmpeg' | head -n 1)
            probe=$(find /tmp/ffmpeg-master-latest-linux64-gpl -type f -path '*/bin/ffprobe' | head -n 1)
            test -n "$bin"
            test -n "$probe"
            install -m 755 "$bin" "$dir/ffmpeg"
            install -m 755 "$probe" "$dir/ffprobe"
          fi
          sudo install -m 755 "$dir/ffmpeg" /usr/local/bin/ffmpeg
          sudo install -m 755 "$dir/ffprobe" /usr/local/bin/ffprobe
          ffmpeg -version | head -n 1

      - name: Record the origin variant
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          WORKER_DISPATCH_TOKEN: ${{ secrets.WORKER_DISPATCH_TOKEN }}
          ACCOUNTS_API: ${{ vars.ACCOUNTS_API }}
        run: python3 scripts/tiktok_record.py --record --handle "${{ inputs.handle }}" --part "${{ inputs.part }}" --room "${{ inputs.room }}"
