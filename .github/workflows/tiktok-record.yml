name: TikTok record

on:
  workflow_dispatch:
    inputs:
      handle:
        description: Public handle
        required: true
        type: string
      part:
        description: Part number
        required: false
        default: "1"
        type: string
      room:
        description: Room id
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: write

# One live, one job. A second dispatch for the same handle waits.
concurrency:
  group: tiktok-record-${{ inputs.handle }}
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache ffmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ffmpeg-static
          key: ffmpeg-static-linux64-v1

      - name: Install ffmpeg
        run: |
          set -euo pipefail
          dir="$HOME/.cache/ffmpeg-static"
          if [ ! -x "$dir/ffmpeg" ]; then
            mkdir -p "$dir"
            curl -fsSL --retry 5 --retry-all-errors -o /tmp/ffmpeg.tar.xz \
              https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
            tar -xJf /tmp/ffmpeg.tar.xz -C /tmp
            bin=$(find /tmp/ffmpeg-master-latest-linux64-gpl -type f -path '*/bin/ffmpeg' | head -n 1)
            probe=$(find /tmp/ffmpeg-master-latest-linux64-gpl -type f -path '*/bin/ffprobe' | head -n 1)
            test -n "$bin"
            test -n "$probe"
            install -m 755 "$bin" "$dir/ffmpeg"
            install -m 755 "$probe" "$dir/ffprobe"
          fi
          sudo install -m 755 "$dir/ffmpeg" /usr/local/bin/ffmpeg
          sudo install -m 755 "$dir/ffprobe" /usr/local/bin/ffprobe
          ffmpeg -version | head -n 1

      - name: Record the origin variant
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python3 scripts/tiktok_record.py --record --handle "${{ inputs.handle }}" --part "${{ inputs.part }}" --room "${{ inputs.room }}"
