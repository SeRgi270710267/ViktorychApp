name: Sync feeds

on:
  schedule:
    # Half-hour sync publishes the site. It does not push the data branch.
    # GitHub often drops one of these slots, so the staggered line is a backup.
    - cron: "*/30 * * * *"
    - cron: "15,45 * * * *"
    # Once a day, upload shards and squash them onto the orphan data branch.
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: manual, or chain from the keepalive job
        required: false
        default: manual
  push:
    branches:
      - main

# The backup job needs contents: write. The build job narrows that back to read.
permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          SOURCE: ${{ github.event.inputs.source }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          from datetime import datetime, timezone
          go = "true"
          event = os.environ.get("EVENT") or ""
          source = os.environ.get("SOURCE") or ""
          # Pushes and a manual dispatch always publish. Schedule and the
          # keepalive chain skip when another sync already started recently,
          # so the two cron lines cannot pile up.
          schedule = os.environ.get("SCHEDULE") or ""
          if schedule == "17 6 * * *":
              pass
          elif event in ("schedule",) or (event == "workflow_dispatch" and source == "chain"):
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{os.environ['REPO']}/actions/workflows/sync.yml/runs?per_page=10",
                  headers={
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "feeds-sync",
                  },
              )
              with urllib.request.urlopen(req, timeout=20) as res:
                  data = json.load(res)
              now = datetime.now(timezone.utc)
              me = os.environ.get("RUN_ID") or ""
              for run in data.get("workflow_runs") or []:
                  if str(run.get("id")) == me:
                      continue
                  if run.get("status") == "completed" and run.get("conclusion") not in ("success", "skipped"):
                      continue
                  if run.get("status") not in ("in_progress", "queued", "waiting", "pending", "completed"):
                      continue
                  started = run.get("run_started_at") or run.get("created_at") or ""
                  if not started:
                      continue
                  dt = datetime.fromisoformat(started.replace("Z", "+00:00"))
                  if (now - dt).total_seconds() < 22 * 60:
                      print(f"skip; run {run.get('id')} started {started}")
                      go = "false"
                      break
          print(f"go={go}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"go={go}\n")
          PY

  build:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: write
    services:
      rsshub:
        image: diygod/rsshub
        ports:
          - 1200:1200
      rssbridge:
        image: rssbridge/rss-bridge
        ports:
          - 8080:80
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Wait for local feed services
        run: |
          python3 - <<'PY'
          import socket, time
          def open_port(port):
              sock = socket.socket()
              sock.settimeout(2)
              try:
                  sock.connect(("127.0.0.1", port))
                  return True
              except OSError:
                  return False
              finally:
                  sock.close()
          for label, port in (("rsshub", 1200), ("rss-bridge", 8080)):
              ready = False
              for _ in range(40):
                  if open_port(port):
                      ready = True
                      break
                  time.sleep(3)
              print(f"{label} {'ready' if ready else 'not ready; later fallbacks will be tried'}")
          PY

      - name: Pull the last published snapshot
        run: python3 scripts/pull_snapshot.py

      - name: Refresh feeds
        # Timelines, Meta CDN refreshes, and Instagram/Threads comments under 7 days.
        # X replies and YouTube video comments are fetched in the browser.
        # Community post comments are written to fallback/ytpost_<id>.json here.
        # Discord is skipped when DISCORD_BOT_TOKEN is unset.
        env:
          INSTAGRAM_COOKIE: ${{ secrets.INSTAGRAM_COOKIE }}
          THREADS_COOKIE: ${{ secrets.THREADS_COOKIE }}
          TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
          VK_SERVICE_TOKEN: ${{ secrets.VK_SERVICE_TOKEN }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: python3 scripts/update_feeds.py

      - name: Assemble the site and check its size
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html app.js styles.css translate.js translate.css favicon.svg manifest.webmanifest sw.js .nojekyll feeds.json people.json suggestions.json feeds.config.json _site/
          mkdir -p _site/icons _site/splash _site/screenshots
          cp icons/* _site/icons/
          cp splash/* _site/splash/
          cp screenshots/* _site/screenshots/
          if [ -n "${GITHUB_SHA:-}" ]; then sed -i "s/__SW_VERSION__/${GITHUB_SHA}/" _site/sw.js; fi
          if [ -f status.json ]; then cp status.json _site/status.json; fi
          if [ -d fallback ]; then
            mkdir -p _site/fallback
            find fallback -name '*.json' -type f -exec cp {} _site/fallback/ \;
          fi
          if [ -d comments ]; then
            mkdir -p _site/comments
            find comments -name '*.json' -type f -exec cp {} _site/comments/ \;
          fi
          if [ -d archive ]; then
            mkdir -p _site/archive
            find archive -name '*.json' -type f -exec cp {} _site/archive/ \;
          fi
          if [ -d discord ]; then
            mkdir -p _site/discord
            find discord -name '*.json' -type f -exec cp --parents {} _site/ \;
          fi
          python3 - <<'PY'
          import os
          import sys
          total = 0
          for dirpath, dirnames, files in os.walk("_site"):
              dirnames[:] = [name for name in dirnames if name != ".git"]
              for name in files:
                  total += os.path.getsize(os.path.join(dirpath, name))
          limit = 200 * 1024 * 1024
          print(f"artifact size: {total} bytes ({total / 1024 / 1024:.2f} MB)")
          if total > limit:
              print(f"ERROR: built site is {total} bytes ({total / 1024 / 1024:.2f} MB), over the 200 MB limit ({limit} bytes).", file=sys.stderr)
              sys.exit(1)
          PY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Upload the sync report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-report
          path: sync-report.json
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload archive shards for the daily backup
        if: github.event_name == 'schedule' && github.event.schedule == '17 6 * * *'
        uses: actions/upload-artifact@v4
        with:
          name: archive-shards
          path: archive/*.json
          if-no-files-found: error
          retention-days: 1

  # Once a day: copy the shards to the Internet Archive when the keys exist,
  # then force-push one squashed commit to the orphan data branch. That branch
  # holds only archive/. The half-hour job does not push it. A GITHUB_TOKEN
  # push does not start another run of this workflow. main is not force-pushed.
  backup:
    needs: build
    if: github.event_name == 'schedule' && github.event.schedule == '17 6 * * *'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: archive-shards
          path: archive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upload shards to the Internet Archive
        continue-on-error: true
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: |
          if [ -z "$IA_ACCESS_KEY" ] || [ -z "$IA_SECRET_KEY" ]; then
            python3 scripts/ia_archive.py
            exit 0
          fi
          python3 -m pip install --disable-pip-version-check -q internetarchive
          python3 scripts/ia_archive.py

      - name: Publish the squashed data branch
        run: |
          if [ -f archive/archive/index.json ]; then
            mv archive/archive/*.json archive/
            rm -rf archive/archive
          fi
          if [ ! -f archive/index.json ]; then
            echo "no archive index; not updating data"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan data-publish
          git rm -rf --cached .
          git add -f archive
          if git diff --cached --quiet; then
            echo "archive empty; not updating data"
            exit 1
          fi
          git commit -m "Archive stubs"
          git push --force origin HEAD:data

  # One issue for a failed sync, a source that has returned nothing for six
  # hours, or a failed Pages deploy. Editing the body does not send another
  # email. The issue closes itself once the next run is healthy.
  alert:
    needs: [gate, build, deploy]
    if: always() && needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: sync-report
          path: .

      - name: Open or close the sync problem
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/sync_health.py

  deploy:
    needs: [gate, build]
    if: needs.gate.outputs.go == 'true'
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

  # Restarts the sync if GitHub drops the cron. Sleeping here does not hold
  # the pages concurrency group, and GITHUB_TOKEN may dispatch this workflow.
  keepalive:
    needs: [gate, deploy]
    if: needs.gate.outputs.go == 'true' && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Queue the next sync
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          sleep 1500
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/actions/workflows/sync.yml/dispatches" \
            -d '{"ref":"main","inputs":{"source":"chain"}}'
