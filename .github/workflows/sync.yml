name: Sync feeds

on:
  schedule:
    # Half-hour sync publishes the site. It does not push the data branch.
    # GitHub often drops one of these slots, so the staggered line is a backup.
    - cron: "*/30 * * * *"
    - cron: "15,45 * * * *"
    # Once a day, upload shards and squash them onto the orphan data branch.
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: manual, or chain from the keepalive job
        required: false
        default: manual
  push:
    branches:
      - main

# The backup job needs contents: write. The build job narrows that back to read.
permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          SOURCE: ${{ github.event.inputs.source }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          from datetime import datetime, timezone
          go = "true"
          event = os.environ.get("EVENT") or ""
          source = os.environ.get("SOURCE") or ""
          # Pushes and a manual dispatch always publish. Schedule and the
          # keepalive chain skip when another sync already started recently,
          # so the two cron lines cannot pile up.
          schedule = os.environ.get("SCHEDULE") or ""
          if schedule == "17 6 * * *":
              pass
          elif event in ("schedule",) or (event == "workflow_dispatch" and source == "chain"):
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{os.environ['REPO']}/actions/workflows/sync.yml/runs?per_page=10",
                  headers={
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "feeds-sync",
                  },
              )
              with urllib.request.urlopen(req, timeout=20) as res:
                  data = json.load(res)
              now = datetime.now(timezone.utc)
              me = os.environ.get("RUN_ID") or ""
              for run in data.get("workflow_runs") or []:
                  if str(run.get("id")) == me:
                      continue
                  if run.get("status") == "completed" and run.get("conclusion") not in ("success", "skipped"):
                      continue
                  if run.get("status") not in ("in_progress", "queued", "waiting", "pending", "completed"):
                      continue
                  started = run.get("run_started_at") or run.get("created_at") or ""
                  if not started:
                      continue
                  dt = datetime.fromisoformat(started.replace("Z", "+00:00"))
                  if (now - dt).total_seconds() < 22 * 60:
                      print(f"skip; run {run.get('id')} started {started}")
                      go = "false"
                      break
          print(f"go={go}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"go={go}\n")
          PY

  build:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: write
    services:
      rsshub:
        image: diygod/rsshub
        ports:
          - 1200:1200
        env:
          # Optional. Empty unless the repository secret is set. RSSHub uses it
          # only for /instagram/stories. The value is masked and never printed.
          INSTAGRAM_COOKIE: ${{ secrets.IG_SESSION }}
          IG_COOKIE: ${{ secrets.IG_SESSION }}
      rssbridge:
        image: rssbridge/rss-bridge
        ports:
          - 8080:80
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check interface strings
        run: python3 scripts/check_i18n.py

      - name: Wait for local feed services
        run: |
          python3 - <<'PY'
          import socket, time
          def open_port(port):
              sock = socket.socket()
              sock.settimeout(2)
              try:
                  sock.connect(("127.0.0.1", port))
                  return True
              except OSError:
                  return False
              finally:
                  sock.close()
          for label, port in (("rsshub", 1200), ("rss-bridge", 8080)):
              ready = False
              for _ in range(40):
                  if open_port(port):
                      ready = True
                      break
                  time.sleep(3)
              print(f"{label} {'ready' if ready else 'not ready; later fallbacks will be tried'}")
          PY

      - name: Pull the last published snapshot
        run: python3 scripts/pull_snapshot.py

      - name: Restore the VK browser
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-v1-${{ runner.os }}

      - name: Restore the VK session cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .vk-session
          key: vk-web-session-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vk-web-session-

      - name: Install the VK browser
        env:
          VK_LOGIN: ${{ secrets.VK_LOGIN }}
          VK_SESSION: ${{ secrets.VK_SESSION }}
        run: |
          if [ -z "${VK_LOGIN:-}" ] && [ -z "${VK_SESSION:-}" ]; then
            echo "VK web session is off"
            exit 0
          fi
          if [ -n "${VK_LOGIN:-}" ]; then
            echo "::add-mask::${VK_LOGIN}"
          fi
          python3 -m pip install --disable-pip-version-check -q playwright
          python3 -m playwright install --with-deps chromium

      - name: Refresh feeds
        # Timelines, Meta CDN refreshes, and Instagram/Threads comments under 7 days.
        # X replies and YouTube video comments are fetched in the browser.
        # Community post comments are written to fallback/ytpost_<id>.json here.
        # Discord bot servers are skipped when DISCORD_BOT_TOKEN is unset.
        # User-auth servers use DISCORD_USER_TOKEN. The value is masked before the sync runs.
        # VK stories use the spare account when VK_LOGIN is set, else VK_SESSION, else VK_USER_TOKEN.
        env:
          INSTAGRAM_COOKIE: ${{ secrets.INSTAGRAM_COOKIE }}
          THREADS_COOKIE: ${{ secrets.THREADS_COOKIE }}
          TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
          VK_SERVICE_TOKEN: ${{ secrets.VK_SERVICE_TOKEN }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_USER_TOKEN: ${{ secrets.DISCORD_USER_TOKEN }}
          IG_SESSION: ${{ secrets.IG_SESSION }}
          VK_USER_TOKEN: ${{ secrets.VK_USER_TOKEN }}
          VK_LOGIN: ${{ secrets.VK_LOGIN }}
          VK_PASSWORD: ${{ secrets.VK_PASSWORD }}
          VK_TOTP_SECRET: ${{ secrets.VK_TOTP_SECRET }}
          VK_SESSION: ${{ secrets.VK_SESSION }}
          VK_SESSION_KEY: ${{ secrets.VK_SESSION_KEY }}
          VK_SESSION_FILE: ${{ github.workspace }}/.vk-session/cookies.enc
        run: |
          if [ -n "${DISCORD_USER_TOKEN:-}" ]; then
            echo "::add-mask::${DISCORD_USER_TOKEN}"
          fi
          if [ -n "${IG_SESSION:-}" ]; then
            echo "::add-mask::${IG_SESSION}"
          fi
          if [ -n "${VK_USER_TOKEN:-}" ]; then
            echo "::add-mask::${VK_USER_TOKEN}"
          fi
          if [ -n "${VK_LOGIN:-}" ]; then
            echo "::add-mask::${VK_LOGIN}"
          fi
          if [ -n "${VK_PASSWORD:-}" ]; then
            echo "::add-mask::${VK_PASSWORD}"
          fi
          if [ -n "${VK_TOTP_SECRET:-}" ]; then
            echo "::add-mask::${VK_TOTP_SECRET}"
          fi
          if [ -n "${VK_SESSION_KEY:-}" ]; then
            echo "::add-mask::${VK_SESSION_KEY}"
          fi
          python3 - <<'PY'
          import json, os, re
          value = os.environ.get("VK_SESSION") or ""
          for line in value.splitlines():
              line = line.strip()
              if line:
                  print("::add-mask::" + line, flush=True)
          rows = None
          try:
              data = json.loads(value) if value else None
          except json.JSONDecodeError:
              data = None
          if isinstance(data, list):
              rows = data
          elif isinstance(data, dict):
              rows = data.get("cookies")
          if isinstance(rows, list):
              for row in rows:
                  if isinstance(row, dict) and row.get("value"):
                      print("::add-mask::" + str(row["value"]), flush=True)
          else:
              for match in re.finditer(r"[^=;\s]+=([^;\s]+)", value):
                  print("::add-mask::" + match.group(1), flush=True)
          PY
          python3 scripts/update_feeds.py

      - name: Upload feeds.config.json
        uses: actions/upload-artifact@v4
        with:
          name: feeds-config
          path: feeds.config.json
          if-no-files-found: error
          retention-days: 1

      - name: Save the VK session cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .vk-session
          key: vk-web-session-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Assemble the site and check its size
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html 404.html app.js styles.css i18n.js translate.js translate.css people.js people.css tv.js tv.css split.js discord-ui.js discord-ui.css spaces.js spaces.css stories.js stories.css music.js music.css hls-1.7.3.min.js favicon.svg favicon.ico manifest.webmanifest sw.js .nojekyll feeds.json stories.json people.json suggestions.json feeds.config.json _site/
          mkdir -p _site/i18n
          cp i18n/*.js _site/i18n/
          if [ -f data/music.json ]; then mkdir -p _site/data; cp data/music.json _site/data/; fi
          if [ -d live ]; then mkdir -p _site/live; cp live/*.json _site/live/; fi
          mkdir -p _site/icons _site/splash _site/screenshots
          cp icons/* _site/icons/
          cp splash/* _site/splash/
          cp screenshots/* _site/screenshots/
          if [ -n "${GITHUB_SHA:-}" ]; then sed -i "s/__SW_VERSION__/${GITHUB_SHA}/" _site/sw.js; fi
          if [ -n "${GITHUB_REPOSITORY:-}" ]; then
            OWNER="${GITHUB_REPOSITORY%%/*}"
            NAME="${GITHUB_REPOSITORY#*/}"
            OWNER_LC=$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')
            SITE_BASE="https://${OWNER_LC}.github.io/${NAME}/"
            sed -i "s|__SITE_BASE__|${SITE_BASE}|g" _site/index.html
          fi
          if [ -f status.json ]; then cp status.json _site/status.json; fi
          if [ -d fallback ]; then
            mkdir -p _site/fallback
            find fallback -name '*.json' -type f -exec cp {} _site/fallback/ \;
          fi
          if [ -d comments ]; then
            mkdir -p _site/comments
            find comments -name '*.json' -type f -exec cp {} _site/comments/ \;
          fi
          if [ -d archive ]; then
            mkdir -p _site/archive
            find archive -name '*.json' ! -name 'ia-state.json' -type f -exec cp {} _site/archive/ \;
          fi
          if [ -d discord ]; then
            mkdir -p _site/discord
            find discord -name '*.json' -type f -exec cp --parents {} _site/ \;
          fi
          python3 scripts/share_pages.py --site _site
          python3 - <<'PY'
          import os
          import sys
          total = 0
          for dirpath, dirnames, files in os.walk("_site"):
              dirnames[:] = [name for name in dirnames if name != ".git"]
              for name in files:
                  total += os.path.getsize(os.path.join(dirpath, name))
          limit = 200 * 1024 * 1024
          print(f"artifact size: {total} bytes ({total / 1024 / 1024:.2f} MB)")
          if total > limit:
              print(f"ERROR: built site is {total} bytes ({total / 1024 / 1024:.2f} MB), over the 200 MB limit ({limit} bytes).", file=sys.stderr)
              sys.exit(1)
          PY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Upload stories.json
        uses: actions/upload-artifact@v4
        with:
          name: stories-json
          path: stories.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload the sync report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-report
          path: sync-report.json
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload archive shards for the daily backup
        if: github.event_name == 'schedule' && github.event.schedule == '17 6 * * *'
        uses: actions/upload-artifact@v4
        with:
          name: archive-shards
          path: archive/*.json
          if-no-files-found: error
          retention-days: 1

  # Auto-added accounts are fetched in this run. The config change is committed
  # afterwards so the next sync keeps them. A GITHUB_TOKEN push does not start
  # another run. Only origin:repost rows are copied, and a removed account is
  # left off the list.
  save-auto-feeds:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/download-artifact@v4
        with:
          name: feeds-config
          path: incoming

      - name: Commit auto-added feeds
        run: |
          python3 - <<'PY'
          import pathlib, sys
          sys.path.insert(0, "scripts")
          from auto_add import merge_into_file
          added = merge_into_file(pathlib.Path("feeds.config.json"), pathlib.Path("incoming/feeds.config.json"))
          pathlib.Path("auto-added.txt").write_text("\n".join(added), encoding="utf-8")
          print("auto-added", ", ".join(added) or "none")
          PY
          if [ ! -s auto-added.txt ]; then
            echo "no new auto-added feeds"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feeds.config.json
          git commit -F - <<EOF
          Auto-add reposted accounts

          $(cat auto-added.txt)
          EOF
          git push origin HEAD:main

  # Once a day: copy the shards to the Internet Archive when the keys exist,
  # then force-push one squashed commit to the orphan data branch. That branch
  # holds only archive/. The half-hour job does not push it. A GITHUB_TOKEN
  # push does not start another run of this workflow. main is not force-pushed.
  # stories.json is not part of feeds.json. The half-hour job publishes it on
  # Pages and, when the list changed, commits that one file on the data branch.
  publish-stories:
    needs: build
    if: needs.gate.outputs.go == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/download-artifact@v4
        with:
          name: stories-json
          path: incoming

      - name: Commit stories.json on the data branch
        run: |
          git fetch --depth=1 origin data || { echo "data branch is not available; stories stay on Pages"; exit 0; }
          git checkout -B data origin/data
          python3 - <<'PY'
          import json, pathlib, sys
          new = json.loads(pathlib.Path("incoming/stories.json").read_text(encoding="utf-8"))
          old = {}
          path = pathlib.Path("stories.json")
          if path.exists():
              try:
                  old = json.loads(path.read_text(encoding="utf-8"))
              except json.JSONDecodeError:
                  old = {}
          if (old.get("accounts") or []) == (new.get("accounts") or []):
              print("stories unchanged")
              sys.exit(0)
          path.write_text(json.dumps(new, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          pathlib.Path("stories.changed").write_text("1", encoding="utf-8")
          PY
          if [ ! -f stories.changed ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stories.json
          git commit -m "Update stories"
          git push origin HEAD:data

  backup:
    needs: [build, publish-stories]
    if: always() && github.event_name == 'schedule' && github.event.schedule == '17 6 * * *' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: archive-shards
          path: archive

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: stories-json
          path: incoming-stories

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upload shards to the Internet Archive
        continue-on-error: true
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: |
          if [ -z "$IA_ACCESS_KEY" ] || [ -z "$IA_SECRET_KEY" ]; then
            python3 scripts/ia_archive.py
            exit 0
          fi
          python3 -m pip install --disable-pip-version-check -q internetarchive
          python3 scripts/ia_archive.py

      - name: Publish the squashed data branch
        run: |
          if [ -f archive/archive/index.json ]; then
            mv archive/archive/*.json archive/
            rm -rf archive/archive
          fi
          git fetch -q --depth=1 origin data || true
          git checkout origin/data -- archive/ia-manifest.json archive/ia-state.json stories.json 2>/dev/null || true
          if [ ! -f archive/index.json ]; then
            echo "no archive index; not updating data"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan data-publish
          git rm -rf --cached .
          if [ -f incoming-stories/stories.json ]; then
            cp incoming-stories/stories.json stories.json
          fi
          git add -f archive
          if [ -f stories.json ]; then
            git add -f stories.json
          fi
          if git diff --cached --quiet; then
            echo "archive empty; not updating data"
            exit 1
          fi
          git commit -m "Archive stubs"
          git push --force origin HEAD:data

  # One issue for a failed sync, a source that has returned nothing for six
  # hours, or a failed Pages deploy. Editing the body does not send another
  # email. The issue closes itself once the next run is healthy.
  alert:
    needs: [gate, build, deploy]
    if: always() && needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: sync-report
          path: .

      - name: Open or close the sync problem
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/sync_health.py

  deploy:
    needs: [gate, build]
    if: needs.gate.outputs.go == 'true'
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

  # Restarts the sync if GitHub drops the cron. Sleeping here does not hold
  # the pages concurrency group, and GITHUB_TOKEN may dispatch this workflow.
  keepalive:
    needs: [gate, deploy]
    if: needs.gate.outputs.go == 'true' && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Queue the next sync
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          sleep 1500
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/actions/workflows/sync.yml/dispatches" \
            -d '{"ref":"main","inputs":{"source":"chain"}}'
