name: Sync feeds

on:
  schedule:
    # Half-hour sync publishes the site. It does not push the data branch.
    # GitHub often drops one of these slots, so the staggered line is a backup.
    - cron: "*/30 * * * *"
    - cron: "15,45 * * * *"
    # Once a day, squash the data branch. This does not upload to archive.org.
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: manual
        required: false
        default: manual
  push:
    branches:
      - main
    paths-ignore:
      # Community and catalog commits are data. The app reads them from R2,
      # so they must not start a Pages deploy. Cleanup marker pushes are not deploys.
      - "data/communities/**"
      - "feeds.json"
      - "stories.json"
      - "people.json"
      - "suggestions.json"
      - ".github/workflows/actions-cleanup.once"
      - ".github/workflows/actions-cleanup.yml"
      - "scripts/actions_cleanup.py"

# Deploy and refresh each cancel their own outdated run. A push must not
# cancel a feed refresh, and a refresh must not hold the Pages deploy.

# The backup job needs contents: write. The build job narrows that back to read.
permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          SOURCE: ${{ github.event.inputs.source }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          from datetime import datetime, timezone
          go = "true"
          event = os.environ.get("EVENT") or ""
          source = os.environ.get("SOURCE") or ""
          # Pushes and a manual dispatch always publish. Schedule and the
          # keepalive chain skip when another sync already started recently,
          # so the two cron lines cannot pile up.
          schedule = os.environ.get("SCHEDULE") or ""
          if schedule == "17 6 * * *":
              pass
          elif event in ("schedule",) or (event == "workflow_dispatch" and source == "chain"):
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{os.environ['REPO']}/actions/workflows/sync.yml/runs?per_page=10",
                  headers={
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "feeds-sync",
                  },
              )
              with urllib.request.urlopen(req, timeout=20) as res:
                  data = json.load(res)
              now = datetime.now(timezone.utc)
              me = os.environ.get("RUN_ID") or ""
              for run in data.get("workflow_runs") or []:
                  if str(run.get("id")) == me:
                      continue
                  if run.get("status") == "completed" and run.get("conclusion") not in ("success", "skipped"):
                      continue
                  if run.get("status") not in ("in_progress", "queued", "waiting", "pending", "completed"):
                      continue
                  started = run.get("run_started_at") or run.get("created_at") or ""
                  if not started:
                      continue
                  dt = datetime.fromisoformat(started.replace("Z", "+00:00"))
                  if (now - dt).total_seconds() < 22 * 60:
                      print(f"skip; run {run.get('id')} started {started}")
                      go = "false"
                      break
          print(f"go={go}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"go={go}\n")
          PY

  # Pages must not publish while this commit's Accounts worker is still
  # deploying. Health was down for the whole previous retry window when the
  # two workflows started together, and the site shipped without the wall.
  wait-accounts:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Wait for this commit's Accounts deploy
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.error, urllib.request

          ACTIVE = {"queued", "in_progress", "waiting", "pending", "requested", "action_required"}
          token = os.environ["GH_TOKEN"]
          repo = os.environ["REPO"]
          sha = os.environ["SHA"]

          def get(path):
              req = urllib.request.Request(
                  f"https://api.github.com{path}",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "feeds-sync",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as res:
                  return json.load(res)

          def runs():
              data = get(f"/repos/{repo}/actions/workflows/accounts.yml/runs?head_sha={sha}&per_page=20")
              return data.get("workflow_runs") or []

          def touches():
              try:
                  commit = get(f"/repos/{repo}/commits/{sha}")
              except (urllib.error.URLError, TimeoutError, OSError, json.JSONDecodeError, KeyError):
                  return None
              files = commit.get("files")
              if not isinstance(files, list) or len(files) >= 300:
                  return None
              for item in files:
                  name = str(item.get("filename") or "")
                  if name.startswith("worker/") or name.startswith("shared/") or name == ".github/workflows/accounts.yml":
                      return True
              return False

          def verdict(run):
              status = run.get("status") or ""
              if status != "completed":
                  return None
              try:
                  listed = get(f"/repos/{repo}/actions/runs/{run['id']}/jobs?per_page=20")
              except (urllib.error.URLError, TimeoutError, OSError, json.JSONDecodeError, KeyError):
                  return None
              deploy = next((job for job in listed.get("jobs") or [] if job.get("name") == "deploy"), None)
              if deploy is None:
                  conclusion = run.get("conclusion") or ""
                  if conclusion == "success":
                      print(f"accounts run {run.get('id')} succeeded")
                      return 0
                  print(f"accounts run {run.get('id')} {conclusion}; refusing to publish Pages")
                  return 1
              if (deploy.get("status") or "") in ACTIVE or deploy.get("status") != "completed":
                  return None
              if deploy.get("conclusion") == "success":
                  print(f"accounts deploy {run.get('id')} succeeded")
                  return 0
              print(f"accounts deploy {run.get('id')} {deploy.get('conclusion')}; refusing to publish Pages")
              return 1

          grace = time.monotonic() + 90
          finish = None
          while True:
              try:
                  found = runs()
              except urllib.error.HTTPError as exc:
                  print(f"accounts run list HTTP {exc.code}")
                  found = None
              except (urllib.error.URLError, TimeoutError, OSError, json.JSONDecodeError):
                  print("accounts run list unavailable")
                  found = None
              run = found[0] if found else None
              if run is not None:
                  code = verdict(run)
                  if code is not None:
                      raise SystemExit(code)
                  if finish is None:
                      finish = time.monotonic() + 15 * 60
                  if time.monotonic() > finish:
                      print(f"accounts run {run.get('id')} did not finish; refusing to publish Pages")
                      raise SystemExit(1)
                  print(f"waiting for accounts run {run.get('id')} ({run.get('status')})")
                  time.sleep(10)
                  continue
              if found == []:
                  changed = touches()
                  if changed is False:
                      print("this commit does not deploy the Accounts worker; Pages continues")
                      raise SystemExit(0)
              if time.monotonic() >= grace:
                  print(f"no Accounts run for {sha}; Pages continues")
                  raise SystemExit(0)
              time.sleep(5)
          PY

  build:
    needs: [gate, wait-accounts]
    if: needs.gate.outputs.go == 'true'
    concurrency:
      group: pages-build
      cancel-in-progress: true
    timeout-minutes: 12
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: write
    # The feed refresh is a separate job. This job only publishes the shell.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check interface strings
        run: python3 scripts/check_i18n.py

      - name: Assemble the site and check its size
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf _site
          python3 scripts/assemble_site.py --site _site
          export VERSION_BUILT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [ -n "${GITHUB_SHA:-}" ]; then sed -i "s|__SW_VERSION__|${GITHUB_SHA}|g; s|__SW_BUILT__|${VERSION_BUILT}|g" _site/sw.js; fi
          mkdir -p version-next
          python3 scripts/write_version.py --out version-next/version.json
          python3 scripts/write_version.py --previous --out _site/version.json
          python3 scripts/share_pages.py --site _site
          python3 - <<'PY'
          import os
          import sys
          total = 0
          for dirpath, dirnames, files in os.walk("_site"):
              dirnames[:] = [name for name in dirnames if name != ".git"]
              for name in files:
                  total += os.path.getsize(os.path.join(dirpath, name))
          limit = 200 * 1024 * 1024
          print(f"artifact size: {total} bytes ({total / 1024 / 1024:.2f} MB)")
          if total > limit:
              print(f"ERROR: built site is {total} bytes ({total / 1024 / 1024:.2f} MB), over the 200 MB limit ({limit} bytes).", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Copy the live catalog into R2 before the shell switch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/catalog_migrate.py --catalog-only

      - name: Move app data behind sign-in when the API is ready
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCOUNTS_API: ${{ vars.ACCOUNTS_API }}
          ACCOUNTS_BACKUP_API: ${{ vars.ACCOUNTS_BACKUP_API || secrets.ACCOUNTS_BACKUP_API || 'https://viktorych-backup.onrender.com' }}
          TURNSTILE_SITEKEY: ${{ secrets.TURNSTILE_SITEKEY }}
          OWNER_CLAIM_CODE: ${{ secrets.OWNER_CLAIM_CODE }}
          ACCOUNT_PEPPER: ${{ secrets.ACCOUNT_PEPPER }}
          ACCOUNT_DELETION_SALT: ${{ secrets.ACCOUNT_DELETION_SALT }}
        run: python3 scripts/accounts_publish.py --site _site --source . --preserve-remote

      - name: Stamp mirror origins
        run: python3 scripts/stamp_mirrors.py --site _site

      - name: Add Web Analytics when the existing token can
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/cf_web_analytics.py --site _site

      - name: Keep a copy for the Cloudflare Pages mirror
        uses: actions/upload-artifact@v4
        with:
          name: cf-pages-site
          path: _site
          include-hidden-files: true
          retention-days: 1

      - name: Keep the version manifest until the assets are live
        uses: actions/upload-artifact@v4
        with:
          name: version-next
          path: version-next/version.json
          retention-days: 1

      - name: Record whether the login wall is on
        uses: actions/upload-artifact@v4
        with:
          name: accounts-wall
          path: accounts-wall/on
          if-no-files-found: ignore
          retention-days: 1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Feed refresh does not block Pages. One slow source is skipped, and the
  # catalog is written to R2 so the app can read it without another deploy.
  refresh:
    needs: gate
    if: needs.gate.outputs.go == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    concurrency:
      group: feed-refresh
      cancel-in-progress: true
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore the pip cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py312-feeds-${{ hashFiles('scripts/update_feeds.py', 'scripts/tiktok_sync.py') }}
          restore-keys: |
            pip-${{ runner.os }}-py312-feeds-
            pip-${{ runner.os }}-py312-

      - name: Start local feed services
        env:
          INSTAGRAM_COOKIE: ${{ secrets.IG_SESSION }}
          IG_COOKIE: ${{ secrets.IG_SESSION }}
          TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
        run: |
          docker run -d --rm --name rsshub -p 1200:1200 \
            -e INSTAGRAM_COOKIE -e IG_COOKIE -e TWITTER_AUTH_TOKEN \
            diygod/rsshub
          docker run -d --rm --name rssbridge -p 8080:80 rssbridge/rss-bridge

      - name: Wait for local feed services
        run: |
          python3 - <<'PY'
          import socket, time
          def open_port(port):
              sock = socket.socket()
              sock.settimeout(2)
              try:
                  sock.connect(("127.0.0.1", port))
                  return True
              except OSError:
                  return False
              finally:
                  sock.close()
          for label, port in (("rsshub", 1200), ("rss-bridge", 8080)):
              ready = False
              for _ in range(20):
                  if open_port(port):
                      ready = True
                      break
                  time.sleep(2)
              print(f"{label} {'ready' if ready else 'not ready; later fallbacks will be tried'}")
          PY

      - name: Copy the live catalog into R2 before refresh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/catalog_migrate.py --catalog-only

      - name: Pull the last published snapshot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 scripts/r2_catalog.py pull
          python3 scripts/pull_snapshot.py

      - name: Restore the VK browser
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-v1-${{ runner.os }}

      - name: Restore the VK session cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .vk-session
          key: vk-web-session-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vk-web-session-

      - name: Install the VK browser
        env:
          VK_LOGIN: ${{ secrets.VK_LOGIN }}
          VK_SESSION: ${{ secrets.VK_SESSION }}
        run: |
          if [ -z "${VK_LOGIN:-}" ] && [ -z "${VK_SESSION:-}" ]; then
            echo "VK web session is off"
            exit 0
          fi
          if [ -n "${VK_LOGIN:-}" ]; then
            echo "::add-mask::${VK_LOGIN}"
          fi
          python3 -m pip install --disable-pip-version-check -q playwright
          python3 -m playwright install --with-deps chromium

      - name: Refresh feeds
        env:
          FEED_DEADLINE_SECONDS: "360"
          PYTHONUNBUFFERED: "1"
          INSTAGRAM_COOKIE: ${{ secrets.INSTAGRAM_COOKIE }}
          THREADS_COOKIE: ${{ secrets.THREADS_COOKIE }}
          TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
          X_PROXY_BASE: ${{ vars.X_PROXY_BASE }}
          X_PROXY_TOKEN: ${{ secrets.X_PROXY_TOKEN }}
          VK_SERVICE_TOKEN: ${{ secrets.VK_SERVICE_TOKEN }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_USER_TOKEN: ${{ secrets.DISCORD_USER_TOKEN }}
          IG_SESSION: ${{ secrets.IG_SESSION }}
          VK_USER_TOKEN: ${{ secrets.VK_USER_TOKEN }}
          VK_LOGIN: ${{ secrets.VK_LOGIN }}
          VK_PASSWORD: ${{ secrets.VK_PASSWORD }}
          VK_TOTP_SECRET: ${{ secrets.VK_TOTP_SECRET }}
          VK_SESSION: ${{ secrets.VK_SESSION }}
          VK_SESSION_KEY: ${{ secrets.VK_SESSION_KEY }}
          VK_SESSION_FILE: ${{ github.workspace }}/.vk-session/cookies.enc
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TIKTOK_BUDGET: "1"
          TIKTOK_BUDGET_SECONDS: "180"
          TIKTOK_TRACKED: ${{ secrets.TIKTOK_TRACKED }}
          TIKTOK_UNLOCKED: ${{ secrets.TIKTOK_UNLOCKED }}
          WORKER_DISPATCH_TOKEN: ${{ secrets.WORKER_DISPATCH_TOKEN }}
          ACCOUNTS_API: ${{ vars.ACCOUNTS_API }}
        run: |
          if [ -n "${DISCORD_USER_TOKEN:-}" ]; then
            echo "::add-mask::${DISCORD_USER_TOKEN}"
          fi
          if [ -n "${IG_SESSION:-}" ]; then
            echo "::add-mask::${IG_SESSION}"
          fi
          if [ -n "${VK_USER_TOKEN:-}" ]; then
            echo "::add-mask::${VK_USER_TOKEN}"
          fi
          if [ -n "${VK_LOGIN:-}" ]; then
            echo "::add-mask::${VK_LOGIN}"
          fi
          if [ -n "${VK_PASSWORD:-}" ]; then
            echo "::add-mask::${VK_PASSWORD}"
          fi
          if [ -n "${VK_TOTP_SECRET:-}" ]; then
            echo "::add-mask::${VK_TOTP_SECRET}"
          fi
          if [ -n "${VK_SESSION_KEY:-}" ]; then
            echo "::add-mask::${VK_SESSION_KEY}"
          fi
          if [ -n "${TIKTOK_TRACKED:-}${TIKTOK_UNLOCKED:-}" ]; then
            python3 - <<'PY'
          import os, re, sys
          raw = (os.environ.get("TIKTOK_TRACKED") or "") + "\n" + (os.environ.get("TIKTOK_UNLOCKED") or "")
          for part in re.split(r"[\s,]+", raw):
              if part:
                  sys.stdout.write("::add-mask::" + part + "\n")
          PY
          fi
          python3 - <<'PY'
          import json, os, re
          value = os.environ.get("VK_SESSION") or ""
          for line in value.splitlines():
              line = line.strip()
              if line:
                  print("::add-mask::" + line, flush=True)
          rows = None
          try:
              data = json.loads(value) if value else None
          except json.JSONDecodeError:
              data = None
          if isinstance(data, list):
              rows = data
          elif isinstance(data, dict):
              rows = data.get("cookies")
          if isinstance(rows, list):
              for row in rows:
                  if isinstance(row, dict) and row.get("value"):
                      print("::add-mask::" + str(row["value"]), flush=True)
          else:
              for match in re.finditer(r"[^=;\s]+=([^;\s]+)", value):
                  print("::add-mask::" + match.group(1), flush=True)
          PY
          set +e
          # The job cap is 15 minutes. Stop each command with time left so the
          # catalog push still runs when a source or yt-dlp ignores its budget.
          timeout --kill-after=20s 400 python3 scripts/update_feeds.py
          feeds=$?
          if [ "$feeds" -eq 124 ]; then
            echo "[refresh] feed updater hit its clock; keeping posts fetched so far"
          fi
          timeout --kill-after=20s 60 python3 -m pip install --disable-pip-version-check -q 'yt-dlp==2026.10.21'
          timeout --kill-after=20s 190 python3 scripts/tiktok_sync.py
          tiktok=$?
          if [ "$tiktok" -eq 124 ]; then
            echo "[refresh] tiktok sync hit its clock"
          fi
          timeout --kill-after=20s 90 python3 scripts/r2_catalog.py push
          push=$?
          if [ "$feeds" -ne 0 ] && [ "$feeds" -ne 124 ]; then
            echo "[refresh] feed updater exited $feeds; unchanged sources keep their last posts"
          fi
          if [ "$push" -ne 0 ]; then
            echo "[refresh] catalog push exited $push"
            exit 1
          fi
          exit 0

      - name: Save the VK session cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .vk-session
          key: vk-web-session-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload the sync report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-report
          path: sync-report.json
          if-no-files-found: ignore
          retention-days: 1

  save-auto-feeds:
    needs: refresh
    if: needs.refresh.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Leave added accounts in private storage
        run: echo "added accounts stay in R2; feeds.config.json is not committed"

  # stories.json stays in R2. publish-stories does not commit it or upload it.
  publish-stories:
    needs: [gate, refresh]
    if: needs.gate.outputs.go == 'true' && needs.refresh.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Leave stories in private storage
        run: echo "stories.json stays in R2; publish-stories does not commit it"

  backup:
    needs: [refresh, publish-stories]
    if: always() && github.event_name == 'schedule' && github.event.schedule == '17 6 * * *' && needs.refresh.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Cloudflare R2 usage
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python3 scripts/r2_usage.py

      - name: Leave archive stubs in private storage
        run: echo "archive stubs stay in R2; the data branch is not updated"

  # One issue for a failed sync, a source that has returned nothing for six
  # hours, or a failed Pages deploy. Editing the body does not send another
  # email. The issue closes itself once the next run is healthy.
  alert:
    needs: [gate, build, deploy, wait-accounts, refresh]
    if: always() && needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: sync-report
          path: .

      - name: Open or close the sync problem
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          ACCOUNTS_RESULT: ${{ needs.wait-accounts.result }}
          REFRESH_RESULT: ${{ needs.refresh.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/sync_health.py

  # wrangler pages deploy publishes the same shell to viktorychapp.
  # A missing Pages permission skips this job's upload and leaves GitHub Pages up.
  pages-mirror:
    needs: [gate, build]
    if: needs.gate.outputs.go == 'true'
    concurrency:
      group: cf-pages-mirror
      cancel-in-progress: true
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install wrangler
        working-directory: worker
        run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: cf-pages-site
          path: _site

      - name: Chrome
        run: |
          if ! command -v google-chrome >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y google-chrome-stable
          fi
          google-chrome --version

      - name: Leave large files off the Pages upload
        run: python3 scripts/cf_pages_prepare.py --site _site --out _mirror

      - name: Load the Pages upload fresh and with old saved data
        run: node scripts/smoke_page.mjs --site _mirror

      - name: Deploy the Pages mirror
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_SHA: ${{ github.sha }}
        run: python3 scripts/cf_pages_deploy.py --dir "$GITHUB_WORKSPACE/_mirror"

  deploy:
    needs: [gate, build, wait-accounts]
    if: needs.gate.outputs.go == 'true'
    concurrency:
      group: pages
      cancel-in-progress: true
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

  verify-live:
    needs: [gate, deploy]
    if: needs.gate.outputs.go == 'true' && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Chrome
        run: |
          if ! command -v google-chrome >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y google-chrome-stable
          fi
          google-chrome --version

      - name: Fail if the live page is black or a script is missing
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: node scripts/smoke_page.mjs --url "${PAGE_URL:-https://viktorychgroup.github.io/ViktorychApp/}" --retry 18

  # Assets are already live. This job publishes version.json after that,
  # so a client cannot be told to update before the files exist.
  publish-version:
    needs: [gate, verify-live, pages-mirror]
    if: always() && needs.gate.outputs.go == 'true' && needs.verify-live.result == 'success' && (needs.pages-mirror.result == 'success' || needs.pages-mirror.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install wrangler
        working-directory: worker
        run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: cf-pages-site
          path: _site

      - uses: actions/download-artifact@v4
        with:
          name: version-next
          path: version-next

      - name: Publish the version manifest after the assets
        run: |
          found=$(find version-next -name version.json -type f | head -n 1)
          test -n "$found"
          cp "$found" _site/version.json

      - uses: actions/upload-pages-artifact@v3
        with:
          name: app-shell-version
          path: _site

      - name: Deploy the version manifest
        id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: app-shell-version

      - name: Deploy the version manifest to the Pages mirror
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python3 scripts/cf_pages_prepare.py --site _site --out _mirror
          python3 scripts/cf_pages_deploy.py --dir "$GITHUB_WORKSPACE/_mirror"

  # Start the Telegram upload from this run. workflow_run can miss a chained
  # start, so the backup is started here with workflow_dispatch.
  queue-telegram:
    needs: [gate, refresh]
    if: needs.gate.outputs.go == 'true' && needs.refresh.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Queue Telegram backup and media extract
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          dispatch() {
            local workflow="$1"
            local body="$2"
            curl -fsS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/actions/workflows/${workflow}/dispatches" \
              -d "$body"
          }
          dispatch telegram-backup.yml '{"ref":"main","inputs":{"loop_only":"false"}}'
          dispatch media-extract.yml '{"ref":"main","inputs":{"cap":"80"}}'
          dispatch reddit.yml '{"ref":"main"}'


