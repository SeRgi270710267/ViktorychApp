name: Sync feeds

on:
  schedule:
    # Half-hour sync publishes shards. It does not commit them.
    - cron: "*/30 * * * *"
    # Once a day, commit archive/ if it changed. github.event.schedule is the cron that fired.
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: pages
  cancel-in-progress: false

# The backup job needs contents: write. The build job narrows that back to read.
permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: write
    services:
      rsshub:
        image: diygod/rsshub
        ports:
          - 1200:1200
      rssbridge:
        image: rssbridge/rss-bridge
        ports:
          - 8080:80
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Wait for local feed services
        run: |
          python3 - <<'PY'
          import socket, time
          def open_port(port):
              sock = socket.socket()
              sock.settimeout(2)
              try:
                  sock.connect(("127.0.0.1", port))
                  return True
              except OSError:
                  return False
              finally:
                  sock.close()
          for label, port in (("rsshub", 1200), ("rss-bridge", 8080)):
              ready = False
              for _ in range(40):
                  if open_port(port):
                      ready = True
                      break
                  time.sleep(3)
              print(f"{label} {'ready' if ready else 'not ready; later fallbacks will be tried'}")
          PY

      - name: Pull the last published snapshot
        run: python3 scripts/pull_snapshot.py

      - name: Refresh feeds
        # Timelines, Meta CDN refreshes, and Instagram/Threads comments under 7 days.
        # X replies and YouTube comments are fetched in the browser.
        env:
          INSTAGRAM_COOKIE: ${{ secrets.INSTAGRAM_COOKIE }}
          THREADS_COOKIE: ${{ secrets.THREADS_COOKIE }}
          TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
        run: python3 scripts/update_feeds.py

      - name: Assemble the site and check its size
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html app.js styles.css favicon.svg .nojekyll feeds.json _site/
          if [ -d comments ]; then
            mkdir -p _site/comments
            find comments -name '*.json' -type f -exec cp {} _site/comments/ \;
          fi
          if [ -d archive ]; then
            mkdir -p _site/archive
            find archive -name '*.json' -type f -exec cp {} _site/archive/ \;
          fi
          python3 - <<'PY'
          import os
          import sys
          total = 0
          for dirpath, dirnames, files in os.walk("_site"):
              dirnames[:] = [name for name in dirnames if name != ".git"]
              for name in files:
                  total += os.path.getsize(os.path.join(dirpath, name))
          limit = 200 * 1024 * 1024
          print(f"artifact size: {total} bytes ({total / 1024 / 1024:.2f} MB)")
          if total > limit:
              print(f"ERROR: built site is {total} bytes ({total / 1024 / 1024:.2f} MB), over the 200 MB limit ({limit} bytes).", file=sys.stderr)
              sys.exit(1)
          PY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Upload archive shards for the daily backup
        if: github.event_name == 'schedule' && github.event.schedule == '17 6 * * *'
        uses: actions/upload-artifact@v4
        with:
          name: archive-shards
          path: archive
          retention-days: 1

  # A daily commit on main, only when archive/ changed. Safer than force-pushing
  # one squashed commit on a data branch: that push is the only copy, so a
  # corrupted or deleted branch cannot be restored. This commit can be reverted.
  # GITHUB_TOKEN pushes do not start another run of this workflow.
  backup:
    needs: build
    if: github.event_name == 'schedule' && github.event.schedule == '17 6 * * *'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: archive-shards
          path: archive

      - name: Commit archive shards when they changed
        run: |
          git add -- archive
          if git diff --cached --quiet; then
            echo "archive unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Back up archive shards"
          git push

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
