name: TikTok live upload

on:
  workflow_dispatch:
    inputs:
      slot:
        description: Backup channel slot
        required: false
        default: "0"
        type: string

permissions:
  contents: read

# One uploader per channel. A second run waits, so the pace stays one sender.
concurrency:
  group: tiktok-upload-${{ inputs.slot }}
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Send buffered segments
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python3 scripts/tiktok_record.py --upload --slot "${{ inputs.slot }}"
