name: TikTok live upload

on:
  workflow_dispatch:
    inputs:
      slot:
        description: Backup channel slot
        required: false
        default: "0"
        type: string

permissions:
  contents: read

# One uploader for every channel. A second run waits, so recorders keep the runners.
concurrency:
  group: tiktok-live-upload
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache ffmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ffmpeg-static
          key: ffmpeg-static-linux64-v1

      - name: Install ffmpeg
        run: |
          set -euo pipefail
          dir="$HOME/.cache/ffmpeg-static"
          if [ ! -x "$dir/ffmpeg" ]; then
            mkdir -p "$dir"
            curl -fsSL --retry 5 --retry-all-errors -o /tmp/ffmpeg.tar.xz \
              https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
            tar -xJf /tmp/ffmpeg.tar.xz -C /tmp
            bin=$(find /tmp/ffmpeg-master-latest-linux64-gpl -type f -path '*/bin/ffmpeg' | head -n 1)
            probe=$(find /tmp/ffmpeg-master-latest-linux64-gpl -type f -path '*/bin/ffprobe' | head -n 1)
            test -n "$bin"
            test -n "$probe"
            install -m 755 "$bin" "$dir/ffmpeg"
            install -m 755 "$probe" "$dir/ffprobe"
          fi
          sudo install -m 755 "$dir/ffmpeg" /usr/local/bin/ffmpeg
          sudo install -m 755 "$dir/ffprobe" /usr/local/bin/ffprobe
          ffmpeg -version | head -n 1

      - name: Send buffered segments
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python3 scripts/tiktok_record.py --upload --slot "${{ inputs.slot }}"
