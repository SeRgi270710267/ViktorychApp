name: Follow requests

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  apply:
    # The repository owner is the org. Only the human who opens issues may apply them.
    if: github.actor == 'owner-account' && (startsWith(github.event.issue.title, 'Follow request') || startsWith(github.event.issue.title, 'Unfollow request') || startsWith(github.event.issue.title, 'Subscription groups') || startsWith(github.event.issue.title, 'Link accounts'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update feeds.config.json
        env:
          ACTOR: ${{ github.actor }}
          OWNER: owner-account
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/follow_request.py
