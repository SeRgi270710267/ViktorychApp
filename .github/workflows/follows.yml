name: Follow requests

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  apply:
    # The repository owner is the org. The script compares the actor to OWNER_ACTOR_SHA256.
    if: (github.event.issue.author_association == 'OWNER' || github.event.issue.author_association == 'MEMBER') && (startsWith(github.event.issue.title, 'Subscription groups') || startsWith(github.event.issue.title, 'Link accounts'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Update feeds.config.json
        env:
          ACTOR: ${{ github.actor }}
          OWNER_ACTOR_SHA256: ${{ secrets.OWNER_ACTOR_SHA256 }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/follow_request.py
