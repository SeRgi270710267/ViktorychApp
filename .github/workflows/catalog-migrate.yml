name: Catalog migrate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  migrate:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Count the catalog without writing
        if: github.event_name == 'pull_request'
        run: python3 scripts/catalog_migrate.py --dry-run

      - uses: actions/setup-node@v4
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          node-version: "22"

      - name: Install wrangler
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        working-directory: worker
        run: npm ci

      - name: Copy the live catalog and set missing Worker secrets
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +x
          python3 scripts/catalog_migrate.py
