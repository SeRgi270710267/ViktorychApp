# Writes LOOP_PRIMARY onto the live loop/current.json. It does not encode.

name: Radio loop primary

on:
  push:
    branches:
      - main
    paths:
      - scripts/radio_loop.py
      - .github/workflows/radio-primary.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: radio-primary
  cancel-in-progress: false

jobs:
  pointer:
    name: Set the live primary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Point loop/current.json at Telegram
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/radio_loop.py --set-primary
