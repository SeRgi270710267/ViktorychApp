# Writes LOOP_PRIMARY onto the live loop/current.json. It does not encode.

name: Radio loop primary

on:
  push:
    branches:
      - main
    paths:
      - scripts/radio_loop.py
      - .github/workflows/radio-primary.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: radio-primary
  cancel-in-progress: false

jobs:
  pointer:
    name: Set the live primary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Point loop/current.json at Telegram
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/radio_loop.py --set-primary
