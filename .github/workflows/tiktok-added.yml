# Fetch public posts for TikTok accounts the owner added in Shorts.
# The accounts Worker dispatches this when GITHUB_DISPATCH_TOKEN is set.
# Without that secret, the next scheduled sync does the same work.
# Public pages only. No cookies and no captcha bypass.

name: TikTok added accounts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Restore the pip cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py312-tiktok-${{ github.run_id }}
          restore-keys: |
            pip-${{ runner.os }}-py312-

      - name: Fetch public posts for added accounts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_DISPATCH_TOKEN: ${{ secrets.WORKER_DISPATCH_TOKEN }}
          ACCOUNTS_API: ${{ vars.ACCOUNTS_API }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "Cloudflare credentials are not set; the next scheduled run will pick this up."
            exit 0
          fi
          python3 -m pip install --disable-pip-version-check -q yt-dlp
          python3 scripts/tiktok_sync.py

      - name: Save the pip cache
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py312-tiktok-${{ github.run_id }}
