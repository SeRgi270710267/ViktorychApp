name: Empty Internet Archive items

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ia-empty.once

permissions:
  contents: read

concurrency:
  group: ia-empty
  cancel-in-progress: false

jobs:
  empty:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Delete files from our Internet Archive items
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
          IA_UPLOADS_ENABLED: "true"
          PYTHONUNBUFFERED: "1"
        run: python3 scripts/ia_empty.py
