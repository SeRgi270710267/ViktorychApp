name: Empty Internet Archive items

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ia-empty.once

permissions:
  contents: read

concurrency:
  group: ia-empty-pass2
  cancel-in-progress: false

jobs:
  empty:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Delete files from our Internet Archive items
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
          IA_UPLOADS_ENABLED: "true"
          PYTHONUNBUFFERED: "1"
        run: python3 scripts/ia_empty.py
