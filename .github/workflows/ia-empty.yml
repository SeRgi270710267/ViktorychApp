name: Empty Internet Archive items

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ia-empty.once

permissions:
  contents: read

concurrency:
  group: ia-empty-pass2
  cancel-in-progress: false

jobs:
  empty:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Delete files from our Internet Archive items
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
          IA_UPLOADS_ENABLED: "true"
          PYTHONUNBUFFERED: "1"
        run: python3 scripts/ia_empty.py
