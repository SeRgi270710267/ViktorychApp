name: Follow request
description: Add an X, Threads, Instagram, YouTube, VK, or RSS account to the synced feeds
title: "Follow request: "
labels: []
body:
  - type: input
    id: account
    attributes:
      label: Account
      description: A profile URL or @handle. RSS feeds use the feed URL.
      placeholder: https://x.com/nasa
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - x
        - threads
        - instagram
        - youtube
        - vk
        - rss
    validations:
      required: true
