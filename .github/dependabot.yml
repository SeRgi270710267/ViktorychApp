# Weekly, grouped dependency updates. One pull request per ecosystem keeps CI
# load low. GitHub Actions updates keep the pinned commit SHAs current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directories: ["/worker", "/backup-server"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      npm:
        update-types: ["minor", "patch"]
