services:
  - type: web
    name: viktorych-backup
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: backup-server/Dockerfile
    dockerContext: .
    healthCheckPath: /v1/health
    envVars:
      - key: PORT
        value: "7860"
      - key: ALLOWED_ORIGINS
        value: "https://viktorychgroup.github.io"
      - key: ACCOUNT_PEPPER
        sync: false
      - key: OWNER_CLAIM_CODE
        sync: false
