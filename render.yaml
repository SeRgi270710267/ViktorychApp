services:
  - type: web
    name: viktorych-backup
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: backup-server/Dockerfile
    dockerContext: .
    # Answered by the server itself, without a D1 or R2 call, so a slow
    # Cloudflare API can never make Render restart a healthy instance.
    healthCheckPath: /backup/health
    # Rebuild only when code the backup runs changes. Every push to main
    # used to rebuild it (70+ builds a day), burning the free 500 build
    # minutes a month; once they run out Render stops deploying and the
    # backup falls behind the Worker.
    buildFilter:
      paths:
        - backup-server/**
        - worker/src/**
        - shared/**
        - render.yaml
      ignoredPaths:
        - "**/*.md"
        - backup-server/*.test.mjs
    envVars:
      - key: PORT
        value: "10000"
      - key: ALLOWED_ORIGINS
        value: "https://viktorychgroup.github.io,https://viktorychapp.pages.dev"
      # Shared Cloudflare account. The backup reads and writes the SAME D1
      # database and R2 bucket as the primary Worker, so logins and sessions
      # always agree even while the Worker is out of free daily requests.
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      # Optional. When unset the database is looked up by name.
      - key: D1_DATABASE_ID
        sync: false
      - key: D1_DATABASE_NAME
        value: "viktorych-accounts"
      - key: R2_BUCKET
        value: "viktorych-data"
      # Must be identical to the primary Worker secret.
      - key: ACCOUNT_PEPPER
        sync: false
      - key: OWNER_CLAIM_CODE
        sync: false
      - key: TURNSTILE_SECRET
        sync: false
      - key: PBKDF2_ITERATIONS
        value: "8000"
      - key: TIKTOK_AUDIENCE
        value: "owner"
      # While awake, this service runs the heavy cron jobs (feed ingest,
      # expired stories, birthday sweeps) so the Worker cron skips them.
      # "0" hands them all back to the Worker.
      - key: RENDER_JOBS
        value: "1"
      # Monthly outbound budget in MB. The free workspace includes 5 GB and
      # going over with no card suspends the service for the month, so past
      # this the backup serves only light JSON and hands jobs to the Worker.
      - key: RENDER_EGRESS_BUDGET_MB
        value: "3500"
      # Optional: with this set, TikTok live watching moves here too.
      - key: GITHUB_DISPATCH_TOKEN
        sync: false
