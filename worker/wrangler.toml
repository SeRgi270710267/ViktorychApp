name = "viktorych-accounts"
main = "src/index.js"
compatibility_date = "2026-01-15"
workers_dev = true

# TELEGRAM_BOT_TOKEN is a Worker secret, not a var:
# npx wrangler secret put TELEGRAM_BOT_TOKEN
[vars]
ALLOWED_ORIGINS = "https://viktorychgroup.github.io"
PBKDF2_ITERATIONS = "8000"
# One flag. "owner" hides TikTok and Shorts except for the owner account.
# "all" shows them to everyone. Keep this in step with accounts.config.js.
TIKTOK_AUDIENCE = "owner"

[[d1_databases]]
binding = "DB"
database_name = "viktorych-accounts"
# The deploy workflow replaces this placeholder after it creates the database.
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "DATA"
bucket_name = "viktorych-data"
