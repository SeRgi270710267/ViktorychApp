name = "viktorych-accounts"
main = "src/index.js"
compatibility_date = "2026-01-15"
workers_dev = true

# SMSPOOL_API_KEY (optional) lets the owner read SMS codes in Inbox › SMS codes
# (GET /v1/owner/sms, owner only, read-only). It is a Worker secret, not a var.
# See docs/sms-codes.md. npx wrangler secret put SMSPOOL_API_KEY
# TELEGRAM_BOT_TOKEN is a Worker secret, not a var:
# npx wrangler secret put TELEGRAM_BOT_TOKEN
# KEYS_ENC_KEY encrypts owner-pasted keys at rest. It is a Worker secret, not a var.
# From worker/: node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"
# npx wrangler secret put KEYS_ENC_KEY
# GITHUB_DISPATCH_TOKEN is a Worker secret, not a var.
# The repository Actions secret is WORKER_DISPATCH_TOKEN (fine-grained PAT,
# repository ViktorychGroup/ViktorychApp, Actions: Read and write).
# GitHub rejects a secret name that starts with GITHUB_.
# .github/workflows/worker-dispatch-secret.yml copies it:
# npx wrangler secret put GITHUB_DISPATCH_TOKEN
# Web Push VAPID. Set both, or leave both unset and the worker keeps the D1 key.
# VAPID_PUBLIC_KEY is the base64url uncompressed P-256 public key.
# VAPID_PRIVATE_JWK is the private key as a JSON JWK string.
# npx wrangler secret put VAPID_PUBLIC_KEY
# npx wrangler secret put VAPID_PRIVATE_JWK
# Optional live TURN. Leave unset to use only the free STUN servers.
# LIVE_TURN_URLS is a comma-separated list of turn: or turns: URLs (four max).
# npx wrangler secret put LIVE_TURN_URLS
# npx wrangler secret put LIVE_TURN_USERNAME
# npx wrangler secret put LIVE_TURN_CREDENTIAL
# When it is unset, an added TikTok account waits for the next scheduled sync.
# HANDLE_HOLD_DAYS keeps a deleted handle from being registered again.
# The default is 30. Set it to 0 to free the handle immediately.
# DELETION_SALT, when set as a secret, salts deletion hashes. Otherwise
# ACCOUNT_PEPPER is used. OWNER_PUBLIC_ID, when set, cannot be deleted.
# OWNER_HANDLE is the owner account handle. OWNER_ID_SHA256 is one or more
# sha256 hex digests of owner ids. The delete route compares hashes and
# never keeps those ids in this file.
# CF_ANALYTICS_TOKEN (a read-only token with Account Analytics: Read) and
# CF_ACCOUNT_ID feed the owner usage panel (GET /v1/owner/usage). Both are
# secrets. Without them the panel shows only the free limits.
# npx wrangler secret put CF_ANALYTICS_TOKEN
# npx wrangler secret put CF_ACCOUNT_ID
# TIKTOK_TRACKED lists accounts the sync follows. TIKTOK_UNLOCKED lists
# which of those stay visible while Shorts is locked. Both are secrets.
[vars]
ALLOWED_ORIGINS = "https://viktorychgroup.github.io,https://viktorychapp.pages.dev"
PBKDF2_ITERATIONS = "30000"
# Hashes made before rounds were recorded used 8000; they upgrade on sign-in.
PBKDF2_LEGACY_ITERATIONS = "8000"
# Free sign-up check: proof of work, honeypot, and a short wait.
# Keep this "on". Tests that post straight to /v1/signup leave it unset.
SIGNUP_GUARD = "on"
# Per-client request cap kept in isolate memory (src/guard.js). Keep this
# "on". Tests that send many requests from one address leave it unset.
REQUEST_GUARD = "on"
# One flag. "owner" hides TikTok and Shorts except for the owner account.
# "all" shows them to everyone. Keep this in step with accounts.config.js.
TIKTOK_AUDIENCE = "owner"

[[d1_databases]]
binding = "DB"
database_name = "viktorych-accounts"
# The deploy workflow replaces this placeholder after it creates the database.
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "DATA"
bucket_name = "viktorych-data"

# The change signal. The cron writes pulse/v1.json here only when a shared
# document or the live list changed. This bucket is public, so clients read
# the pulse without spending Worker requests. It holds version marks only.
[[r2_buckets]]
binding = "PULSE"
bucket_name = "superintelmusic-live"

# Free cron. Every minute it watches the owner's TikTok handles and dispatches
# tiktok-record.yml the moment a live starts. GitHub's own `*/5` schedule is
# only a fallback: it often runs every two to six hours.
# The Discord mirror still runs on the quarter hour.
[triggers]
crons = ["* * * * *"]

# Hot public profile and community reads. The deploy fills this id when the
# token can edit Workers KV. A missing permission removes the binding and
# the Worker reads D1 directly.
[[kv_namespaces]]
binding = "CACHE"
id = "00000000000000000000000000000002"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

# One hibernating object per account. Presence and notifications publish
# into it by topic. Sockets stay open only while a tab is visible.
# Do not add a second class or binding.
[[durable_objects.bindings]]
name = "ACCOUNT_CHANNEL"
class_name = "AccountChannel"

[[migrations]]
tag = "v1-account-channel"
new_sqlite_classes = ["AccountChannel"]
